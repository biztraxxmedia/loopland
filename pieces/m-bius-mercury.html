<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Möbius Mercury · LoopLand 1/1</title>
<style>
html,body{margin:0;height:100%;background:#040407;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style>
<link rel="icon" href="data:,"></head>
<body>
<canvas id="c" aria-label="A liquid-chrome Möbius ribbon with orbiting mercury droplets, looping forever"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uP;
uniform int uAA;
#define TAU 6.283185307179586
float A;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}
float smin(float a,float b,float k){float h=max(k-abs(a-b),0.)/k;return min(a,b)-h*h*k*.25;}

float map(vec3 p){
  vec3 q=p;
  q.yz*=rot(.62+.1*sin(A));
  q.xy*=rot(.18*sin(A)+.12);
  q.xz*=rot(A);
  float ang=atan(q.z,q.x);
  vec2 t=vec2(length(q.xz)-1.2,q.y);
  t*=rot(.5*ang+A);                      /* half twist => Möbius; +A keeps it rolling, periodic */
  float w=.30+.05*sin(3.*ang+2.*A);
  float d=length(max(abs(t)-vec2(w,.035),0.))-.085;
  for(int i=0;i<5;i++){
    float fi=float(i);
    float dir=mod(fi,2.)<1.?1.:-1.;
    float a=dir*A*(fi<2.?2.:1.)+fi*1.2566;
    vec3 c=vec3(cos(a)*1.32,.42*sin(2.*A+fi*2.4),sin(a)*1.32);
    c.yz*=rot(-.62);
    d=smin(d,length(p-c)-(.16+.045*sin(A+fi*1.7)),.32);
  }
  d=min(d,length(p-vec3(0.,.08*sin(2.*A),0.))-(.27+.04*sin(2.*A+1.)));
  return d;
}

vec3 calcN(vec3 p){
  const vec2 k=vec2(1.,-1.)*.0015;
  return normalize(k.xyy*map(p+k.xyy)+k.yyx*map(p+k.yyx)+k.yxy*map(p+k.yxy)+k.xxx*map(p+k.xxx));
}

float march(vec3 ro,vec3 rd,float tmax){
  float t=0.;
  for(int i=0;i<110;i++){
    float h=map(ro+rd*t);
    if(h<.0008*t||t>tmax)break;
    t+=h*.72;
  }
  return t;
}

vec3 env(vec3 d){
  float ang=atan(d.z,d.x);
  vec3 c=d.y>0.?mix(vec3(.025,.02,.04),vec3(.09,.08,.13),pow(d.y,.7)):mix(vec3(.03,.025,.045),vec3(.004),pow(-d.y,.4));
  c+=vec3(.9,.85,1.)*smoothstep(.035,.0,abs(d.y-.08))*.9;                         /* bright horizon line */
  c+=vec3(1.)*smoothstep(.02,.0,abs(fract(ang*1.2732)-.5)-.47)*smoothstep(.15,.4,d.y)*smoothstep(.8,.55,d.y)*.7; /* panel seams */
  c+=vec3(1.)*smoothstep(.8,.97,d.y)*1.6;                                   /* overhead softbox */
  c+=vec3(1.,.93,.86)*smoothstep(.22,.0,abs(ang+.55))*smoothstep(-.1,.5,d.y)*smoothstep(.85,.6,d.y)*1.2;
  c+=vec3(1.,.16,.58)*smoothstep(.17,.0,abs(ang-1.15))*smoothstep(-.35,.25,d.y)*3.2;   /* magenta strip */
  c+=vec3(.12,.82,1.)*smoothstep(.15,.0,abs(ang+2.05))*smoothstep(-.35,.25,d.y)*3.2;   /* cyan strip */
  c+=vec3(1.,.55,.12)*smoothstep(.05,.0,abs(ang-2.75))*smoothstep(-.2,.2,d.y)*2.;     /* amber kicker */
  c+=vec3(.45,.35,1.)*exp(-abs(d.y+.02)*22.)*.5;                                     /* horizon */
  return c;
}

vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}

vec3 shadeObj(vec3 p,vec3 rd){
  vec3 n=calcN(p);
  vec3 r=reflect(rd,n);
  float fre=pow(1.-max(dot(n,-rd),0.),4.);
  float ao=clamp(map(p+n*.12)/.12,0.,1.)*.6+.4;
  vec3 film=.5+.5*cos(TAU*(vec3(0.,.33,.67)+fre*1.3+dot(n,vec3(.25,.6,.3))*.55+uP));
  vec3 tint=mix(vec3(.95,.96,1.),film,.36+.5*fre);
  vec3 col=env(r)*tint*ao;
  col+=vec3(1.,.3,.7)*pow(max(dot(r,normalize(vec3(.7,.2,.6))),0.),60.)*.6;
  return col;
}

vec3 bg(vec2 uv,vec3 rd){
  vec3 c=mix(vec3(.012,.010,.02),vec3(.002,.002,.004),length(uv*vec2(.8,1.)));
  c+=vec3(.55,.18,.6)*.035*exp(-dot(uv-vec2(.0,.12),uv-vec2(.0,.12))*2.2);
  c+=vec3(.1,.5,.8)*.025*exp(-dot(uv-vec2(.6,-.2),uv-vec2(.6,-.2))*3.);
  return c;
}

vec3 render(vec2 fc){
  vec2 uv=(fc-.5*uRes)/uRes.y;
  vec3 ro=vec3(.6*sin(A),.8+.12*sin(2.*A),7.3);
  vec3 ta=vec3(0.,-.05,0.);
  vec3 f=normalize(ta-ro),rr=normalize(cross(vec3(0,1,0),f)),u=cross(f,rr);
  vec3 rd=normalize(uv.x*rr+uv.y*u+2.*f);
  float floorY=-1.12;
  float tF=rd.y<0.?(floorY-ro.y)/rd.y:1e5;
  float t=march(ro,rd,min(tF,9.));
  vec3 col;
  if(t<min(tF,9.)){
    col=shadeObj(ro+rd*t,rd);
  }else if(tF<40.){
    vec3 p=ro+rd*tF;
    vec3 base=bg(uv,rd)*.6;
    float fade=exp(-max(length(p.xz)-1.,0.)*.55);
    vec3 rr2=reflect(rd,vec3(0,1,0));
    float fre=.04+.96*pow(1.-max(-rd.y,0.),5.);
    float t2=march(p+vec3(0,.002,0),rr2,6.);
    vec3 refl=t2<6.?shadeObj(p+rr2*t2,rr2):vec3(.0);
    float sh=1.-.85*exp(-length(p.xz)*1.25);   /* contact shadow */
    col=base*sh+refl*fade*(.18+.5*fre);
    /* fine brushed rings on the floor */
    col=mix(bg(uv,rd),col,smoothstep(9.,4.,tF));
  }else{
    col=bg(uv,rd);
  }
  return col;
}

float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}

void main(){
  A=TAU*uP;
  vec3 col=vec3(0.);
  float n=0.;
  for(int j=0;j<9;j++){
    if(j>=uAA*uAA)break;
    float aa=float(uAA);
    vec2 o=(vec2(mod(float(j),aa),floor(float(j)/aa))+.5)/aa-.5;
    col+=render(gl_FragCoord.xy+o);
    n+=1.;
  }
  col/=n;
  col=aces(col*1.15);
  col=pow(col,vec3(1./2.2));
  vec2 q=gl_FragCoord.xy/uRes;
  col*=.55+.45*pow(16.*q.x*q.y*(1.-q.x)*(1.-q.y),.18);
  col+=(hash(gl_FragCoord.xy+floor(fract(uP)*360.)*17.)-.5)*.022;
  gl_FragColor=vec4(col,1.);
}
</script>
<script>
(()=>{
  const T=12, FPS=30;                       /* loop length (s) and export frame rate */
  const params=new URLSearchParams(location.search);
  const RENDER=params.has('render');
  const EMBED=window.self!==window.top;
  const cv=document.getElementById('c');
  const gl=cv.getContext('webgl',{preserveDrawingBuffer:true,antialias:false,alpha:false,powerPreference:'high-performance'});
  if(!gl){document.body.innerHTML='<p style="color:#aaa;font:14px sans-serif;padding:2em">WebGL is required for this piece.</p>';return;}
  const vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));
  gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes=gl.getUniformLocation(pr,'uRes'),uP=gl.getUniformLocation(pr,'uP'),uAA=gl.getUniformLocation(pr,'uAA');
  let scale=RENDER?1:Math.min(devicePixelRatio||1,EMBED?1.25:1.75);
  let aa=RENDER?(+params.get('aa')||2):1;
  function resize(){
    const w=Math.max(2,Math.round(cv.clientWidth*scale)),h=Math.max(2,Math.round(cv.clientHeight*scale));
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
    gl.viewport(0,0,w,h);
  }
  function draw(p){
    resize();
    gl.uniform2f(uRes,cv.width,cv.height);
    gl.uniform1f(uP,((p%1)+1)%1);
    gl.uniform1i(uAA,aa);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  /* deterministic hook for frame export: p in [0,1) */
  window.renderFrame=p=>{draw(p);gl.finish();return true;};
  window.LOOP={T,FPS,frames:T*FPS};
  if(RENDER)return;
  let speed=matchMedia('(prefers-reduced-motion: reduce)').matches?.25:1;
  let paused=false,last=0,acc=0,slow=0;
  addEventListener('message',e=>{if(e.data&&e.data.loopland)paused=e.data.loopland==='pause';});
  document.addEventListener('visibilitychange',()=>{last=0;});
  function tick(ts){
    requestAnimationFrame(tick);
    if(paused){last=0;return;}
    const dt=last?Math.min((ts-last)/1000,1/30):0;last=ts;
    acc+=dt*speed;
    const t0=performance.now();
    draw(acc/T);
    /* adaptive resolution keeps slow GPUs smooth */
    if(dt>0.034){if(++slow>20&&scale>.5){scale*=.85;slow=0;}}else slow=Math.max(0,slow-1);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
