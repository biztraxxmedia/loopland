<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="icon" href="data:,"></head><body>
<title>Ancient Lava Lamp</title>
<meta name="claude:viewport-fit-sides" content="cover">


<style>
/* Layout: one full-bleed canvas scene; a quiet carved caption top-left, a whispered hint at the bottom. Single dusk look on purpose. */
:root{--bg:#0d0814;--ink:#f3dcc0;--dim:rgba(243,220,192,.62);--ember:#ff5a2a;color-scheme:dark;
  --display:"Cinzel","Trajan Pro",Georgia,serif;--hand:"Cormorant Garamond",Georgia,serif}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.cap{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));font-family:var(--display);letter-spacing:.34em;font-size:11px;color:var(--dim);pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cap b{display:block;font-weight:700;font-size:clamp(16px,2.4vw,22px);letter-spacing:.16em;color:var(--ink);margin-top:5px}
.hint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--hand);font-style:italic;font-size:clamp(16px,2.2vw,20px);color:var(--dim);pointer-events:none;transition:opacity 1.6s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-shadow:0 1px 8px rgba(0,0,0,.8)}
.hint.gone{opacity:0}
</style>
<canvas id="c" aria-label="An ancient stone lava lamp in a ruined desert at dusk. A living red blob inside watches you with one eye, depending on which side you are on."></canvas>
<div class="cap">Relic Nº 7 · Dune Sea<b>The Ancient Lava Lamp</b></div>
<div class="hint" id="hint">It's watching. Move to the left or right of the lamp.</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), hint = document.getElementById('hint');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, dpr, L, u, cx, gY, chTop, chBot, M = 60, layers = {}, lampC, fc, fx, img, gw, gh, runes = [], cracks = [];
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr); const g = c.getContext('2d'); g.scale(dpr, dpr); return [c, g]; }
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hw = t => lerp(11.5, 6.5, t) + 3.8 * Math.sin(Math.PI * t) * (1 - t * .3); /* chamber half-width (u) at height t */

/* ---------- stone helpers ---------- */
function speckle(g, R, x, y, w, h, n, dark = .18, light = .12) {
  for (let i = 0; i < n; i++) { const px = x + R() * w, py = y + R() * h, s = R() * 1.6 + .3; g.fillStyle = R() < .55 ? `rgba(30,12,6,${R() * dark})` : `rgba(255,225,190,${R() * light})`; g.fillRect(px, py, s, s); }
}
function crackLine(g, R, x, y, len, ang, col, wdt) {
  g.strokeStyle = col; g.lineWidth = wdt; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y); const pts = [[x, y]];
  for (let i = 0; i < 6; i++) { ang += (R() - .5) * .9; x += Math.cos(ang) * len / 6; y += Math.sin(ang) * len / 6; g.lineTo(x, y); pts.push([x, y]); }
  g.stroke(); return pts;
}
function stoneBlock(g, R, x, y, w, h, lit = 1) {
  const gr = g.createLinearGradient(x, y, x + w, y + h); gr.addColorStop(0, shade('#d9a676', lit)); gr.addColorStop(.55, shade('#9a6a48', lit)); gr.addColorStop(1, shade('#4b2a1c', lit));
  const c = Math.min(w, h) * .18;
  g.beginPath(); g.moveTo(x + c * R(), y); g.lineTo(x + w - c * R(), y); g.lineTo(x + w, y + c * R()); g.lineTo(x + w, y + h); g.lineTo(x, y + h); g.lineTo(x, y + c * R()); g.closePath();
  g.fillStyle = gr; g.fill(); g.save(); g.clip(); speckle(g, R, x, y, w, h, w * h / 14);
  g.fillStyle = 'rgba(255,220,180,.18)'; g.fillRect(x, y, w, Math.max(1, h * .12)); g.restore();
  g.strokeStyle = 'rgba(25,10,6,.45)'; g.lineWidth = 1; g.stroke();
}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = n >> 8 & 255, b = n & 255; return `rgb(${r * k | 0},${gg * k | 0},${b * k | 0})`; }
function rock(g, R, x, y, s, lit = 1) {
  const n = 7 + (R() * 3 | 0), pts = [];
  for (let i = 0; i < n; i++) { const a = Math.PI + i / (n - 1) * Math.PI, r = s * (.65 + R() * .45); pts.push([x + Math.cos(a) * r * 1.25, y + Math.sin(a) * r * (.7 + R() * .3)]); }
  g.fillStyle = 'rgba(20,8,5,.35)'; g.beginPath(); g.ellipse(x + s * .5, y + s * .08, s * 1.5, s * .22, 0, 0, 7); g.fill();
  const gr = g.createLinearGradient(x - s, y - s, x + s, y); gr.addColorStop(0, shade('#d29a6a', lit)); gr.addColorStop(.6, shade('#8a5a3c', lit)); gr.addColorStop(1, shade('#3c2016', lit));
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fillStyle = gr; g.fill();
  g.save(); g.clip(); speckle(g, R, x - s * 1.3, y - s, s * 2.6, s, s * s * .5);
  g.fillStyle = 'rgba(255,215,170,.16)'; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n / 2; i++) g.lineTo(pts[i][0], pts[i][1]); g.lineTo(x, y - s * .2); g.closePath(); g.fill();
  if (s > 8) crackLine(g, R, x - s * .3 + R() * s * .6, y - s * .6, s * .8, 1.2 + R(), 'rgba(30,12,6,.5)', .8);
  g.restore(); g.strokeStyle = 'rgba(25,10,6,.4)'; g.lineWidth = .8; g.stroke();
}
function column(g, R, x, base, w, h, o = {}) {
  const l = x - w / 2, r = x + w / 2, ph = w * .3, pw = w * 1.4, top = base - ph - h;
  g.fillStyle = 'rgba(25,8,12,.3)'; g.beginPath(); g.moveTo(l - w * .2, base); g.lineTo(r + w * .2, base); g.lineTo(r + h * .5, base + w * .22); g.lineTo(l + h * .5, base + w * .22); g.closePath(); g.fill();
  stoneBlock(g, R, x - pw / 2, base - ph, pw, ph, o.lit || 1);
  const pts = [[l, base - ph]], n = 8; let tops = [];
  for (let i = 0; i <= n; i++) { const px = l + w * i / n, py = top + (o.broken ? (R() * .9 - .15) * w * (i % 2 ? 1 : .6) + (i / n) * w * .5 * (o.slant || 0) : 0); tops.push([px, py]); }
  g.beginPath(); g.moveTo(l, base - ph); tops.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(r, base - ph); g.closePath();
  const gr = g.createLinearGradient(l, 0, r, 0); const k = o.lit || 1;
  gr.addColorStop(0, shade('#e8b588', k)); gr.addColorStop(.3, shade('#c08d62', k)); gr.addColorStop(.72, shade('#7d4d34', k)); gr.addColorStop(1, shade('#3a2018', k));
  g.fillStyle = gr; g.fill(); g.save(); g.clip();
  const fl = 9; for (let i = 0; i < fl; i++) { const fxp = l + w * (i + .5) / fl; g.fillStyle = 'rgba(40,16,8,.22)'; g.fillRect(fxp + w * .025, top - w, w * .03, h + w * 2); g.fillStyle = 'rgba(255,230,200,.16)'; g.fillRect(fxp - w * .02, top - w, w * .025, h + w * 2); }
  for (let y = base - ph - w * 1.15; y > top - w; y -= w * 1.15) { g.fillStyle = 'rgba(35,14,8,.45)'; g.fillRect(l, y, w, 1.4); g.fillStyle = 'rgba(255,220,180,.18)'; g.fillRect(l, y + 1.4, w, 1); }
  speckle(g, R, l, top - w, w, h + w * 2, w * h / 10);
  for (let i = 0; i < 3; i++) crackLine(g, R, l + R() * w, top + R() * h * .7, w * (1 + R()), Math.PI / 2 + (R() - .5) * 1.2, 'rgba(25,10,5,.55)', 1);
  g.fillStyle = `rgba(110,45,60,${o.fog || 0})`; g.fillRect(l - 2, top - w, w + 4, h + w * 2);
  g.restore();
  if (o.broken) { g.strokeStyle = 'rgba(255,215,170,.45)'; g.lineWidth = 1.2; g.beginPath(); tops.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); }
  if (o.cap) { const ch = w * .32, ew = w * 1.32; g.beginPath(); g.moveTo(l, top); g.quadraticCurveTo(l - w * .1, top - ch * .7, x - ew / 2, top - ch); g.lineTo(x + ew / 2 - w * .25, top - ch); g.lineTo(x + ew / 2 - w * .38, top - ch * .4); g.lineTo(r, top); g.closePath();
    const cg = g.createLinearGradient(l, 0, r, 0); cg.addColorStop(0, shade('#e8b588', k)); cg.addColorStop(1, shade('#4a2a1c', k)); g.fillStyle = cg; g.fill();
    stoneBlock(g, R, x - ew * .58, top - ch - w * .3, ew * .95, w * .3, k * .95); }
  if (o.fog) { g.fillStyle = `rgba(110,45,60,${o.fog * .7})`; g.fillRect(x - pw / 2, base - ph, pw, ph); }
}
function drum(g, R, x, y, len, rr, lit = 1) {
  g.fillStyle = 'rgba(20,8,5,.38)'; g.beginPath(); g.ellipse(x + len * .55, y + rr * .95, len * .62, rr * .22, 0, 0, 7); g.fill();
  const gr = g.createLinearGradient(0, y - rr, 0, y + rr); gr.addColorStop(0, shade('#e3b083', lit)); gr.addColorStop(.45, shade('#a87650', lit)); gr.addColorStop(1, shade('#3b2116', lit));
  g.fillStyle = gr; g.fillRect(x, y - rr, len, rr * 2);
  g.save(); g.beginPath(); g.rect(x, y - rr, len, rr * 2); g.clip();
  for (let i = 0; i < 10; i++) { const yy = y - rr + rr * 2 * (i + .5) / 10; g.fillStyle = 'rgba(40,16,8,.2)'; g.fillRect(x, yy + 1, len, 1.2); g.fillStyle = 'rgba(255,225,190,.12)'; g.fillRect(x, yy - .5, len, 1); }
  speckle(g, R, x, y - rr, len, rr * 2, len * rr * .2); crackLine(g, R, x + len * .4, y - rr, rr * 1.6, 1.4, 'rgba(25,10,5,.55)', 1); g.restore();
  const eg = g.createRadialGradient(x - rr * .1, y - rr * .3, rr * .1, x, y, rr * 1.1); eg.addColorStop(0, shade('#f0c497', lit)); eg.addColorStop(1, shade('#9a6a46', lit));
  g.fillStyle = eg; g.beginPath(); for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2, sc = 1 - (i % 2 ? .05 : 0); g.lineTo(x + Math.cos(a) * rr * .42 * sc, y + Math.sin(a) * rr * sc); } g.closePath(); g.fill();
  g.strokeStyle = 'rgba(60,25,12,.4)'; g.lineWidth = 1; g.beginPath(); g.ellipse(x, y, rr * .18, rr * .45, 0, 0, 7); g.stroke();
  g.save(); g.clip(); speckle(g, R, x - rr * .5, y - rr, rr, rr * 2, rr * 6); g.restore();
}
function dune(g, R, y0, amp, fill, ridge) {
  const ph = [R() * 6, R() * 6, R() * 6];
  g.beginPath(); g.moveTo(-M, H + M);
  const pts = []; for (let x = -M; x <= W + M; x += 6) { const y = y0 + Math.sin(x / W * 3.1 + ph[0]) * amp + Math.sin(x / W * 7.3 + ph[1]) * amp * .35 + Math.sin(x / W * 17 + ph[2]) * amp * .08; pts.push([x, y]); g.lineTo(x, y); }
  g.lineTo(W + M, H + M); g.closePath(); g.fillStyle = fill; g.fill();
  if (ridge) { g.strokeStyle = ridge; g.lineWidth = 1.2; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); }
}

/* ---------- layers ---------- */
function layer(fn) { const [c, g] = mk(W + 2 * M, H + 2 * M); g.translate(M, M); fn(g); return c; }
function buildSky() {
  layers.sky = layer(g => { const R = rng(11);
    const gr = g.createLinearGradient(0, -M, 0, H * .68); gr.addColorStop(0, '#120a24'); gr.addColorStop(.38, '#2f1538'); gr.addColorStop(.66, '#7a2a3a'); gr.addColorStop(.86, '#c9502e'); gr.addColorStop(1, '#f08a3c');
    g.fillStyle = gr; g.fillRect(-M, -M, W + 2 * M, H + 2 * M);
    for (let i = 0; i < 260; i++) { const y = R() * H * .5, a = (1 - y / (H * .5)) * .9 * R(); g.fillStyle = `rgba(255,240,225,${a})`; const s = R() < .06 ? 1.6 : .9; g.fillRect(R() * (W + 2 * M) - M, y - M * .5, s, s); }
    const sx = W * .2, sy = H * .63, sr = Math.min(W, H) * .1;
    let sg = g.createRadialGradient(sx, sy, sr * .2, sx, sy, sr * 5); sg.addColorStop(0, 'rgba(255,190,120,.55)'); sg.addColorStop(.3, 'rgba(255,120,60,.18)'); sg.addColorStop(1, 'rgba(255,90,40,0)'); g.fillStyle = sg; g.fillRect(-M, -M, W + 2 * M, H + 2 * M);
    sg = g.createRadialGradient(sx, sy, 0, sx, sy, sr); sg.addColorStop(0, '#fff1c8'); sg.addColorStop(.7, '#ffbe6e'); sg.addColorStop(1, 'rgba(255,140,60,.0)'); g.fillStyle = sg; g.beginPath(); g.arc(sx, sy, sr, 0, 7); g.fill();
    for (let i = 0; i < 7; i++) { const y = H * (.32 + R() * .26), x = R() * W, w = W * (.2 + R() * .4); g.fillStyle = `rgba(${200 + R() * 55 | 0},${90 + R() * 60 | 0},${90 + R() * 40 | 0},${.05 + R() * .08})`; g.beginPath(); g.ellipse(x, y, w, H * .006 + R() * H * .008, 0, 0, 7); g.fill(); }
  });
}
function buildFar() {
  layers.far = layer(g => { const R = rng(23);
    dune(g, R, H * .625, H * .025, '#3d1a2c', 'rgba(255,150,120,.12)');
    const bx = W * .66; for (let i = 0; i < 4; i++) { if (i === 2) continue; const x = bx + i * H * .025, h = H * (.04 + R() * .04); g.fillStyle = '#3a1828'; g.fillRect(x, H * .628 - h, H * .009, h); }
    g.fillStyle = '#3a1828'; g.fillRect(bx - H * .004, H * .628 - H * .085, H * .055, H * .008);
    g.beginPath(); g.arc(W * .38, H * .63, H * .03, Math.PI, 0); g.lineTo(W * .38 + H * .03, H * .64); g.lineTo(W * .38 + H * .022, H * .64); g.arc(W * .38, H * .64, H * .022, 0, Math.PI, true); g.closePath(); g.fill();
    dune(g, R, H * .655, H * .02, '#58242f', 'rgba(255,160,120,.14)');
  });
}
function buildMid() {
  layers.mid = layer(g => { const R = rng(37);
    dune(g, R, H * .69, H * .018, '#6e3026', 'rgba(255,175,130,.22)');
    const s = H;
    column(g, R, W * .06, H * .735, s * .062, s * .38, {broken: 1, fog: .22, lit: .95});
    column(g, R, W * .22, H * .725, s * .05, s * .22, {broken: 1, fog: .28, slant: 1, lit: .9});
    column(g, R, W * .8, H * .735, s * .066, s * .42, {cap: 1, fog: .2});
    column(g, R, W * .955, H * .73, s * .056, s * .13, {broken: 1, fog: .26, lit: .9});
    stoneBlock(g, R, W * .855, H * .695, s * .09, s * .035, .85);
  });
}
function buildGround() {
  layers.ground = layer(g => { const R = rng(51), top = H * .705;
    g.beginPath(); g.moveTo(-M, H + M); for (let x = -M; x <= W + M; x += 6) g.lineTo(x, top + Math.sin(x / W * 4 + 1) * H * .008 + Math.sin(x / W * 11) * H * .003); g.lineTo(W + M, H + M); g.closePath();
    const gr = g.createLinearGradient(0, top, 0, H); gr.addColorStop(0, '#a4583a'); gr.addColorStop(.35, '#7c3c26'); gr.addColorStop(.75, '#4a2016'); gr.addColorStop(1, '#25100a'); g.fillStyle = gr; g.fill();
    g.save(); g.clip();
    const lg = g.createLinearGradient(0, 0, W, 0); lg.addColorStop(0, 'rgba(255,180,110,.16)'); lg.addColorStop(.6, 'rgba(255,180,110,0)'); g.fillStyle = lg; g.fillRect(-M, top - 10, W + 2 * M, H);
    for (let i = 0; i < 90; i++) { const y = top + H * .01 + R() * (H - top), x = R() * W, len = W * (.08 + R() * .25), a = H * .003 * (y / H), ph = R() * 6;
      for (const [off, col] of [[1.2, 'rgba(40,14,8,.16)'], [0, 'rgba(255,205,160,.09)']]) { g.strokeStyle = col; g.lineWidth = 1; g.beginPath(); for (let k = 0; k <= 20; k++) { const xx = x + len * k / 20 - len / 2, yy = y + off + Math.sin(k / 20 * 6 + ph) * a; k ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke(); } }
    for (let i = 0; i < 6000; i++) { const y = top + R() * (H - top); g.fillStyle = R() < .5 ? `rgba(255,215,170,${R() * .14})` : `rgba(30,10,5,${R() * .2})`; g.fillRect(R() * W, y, 1, 1); }
    g.restore();
    /* lamp shadow (sun is low on the left) */
    g.fillStyle = 'rgba(20,6,4,.38)'; g.beginPath(); g.moveTo(cx - 22 * u, gY); g.lineTo(cx + 22 * u, gY); g.lineTo(cx + 95 * u, gY + 7 * u); g.lineTo(cx + 60 * u, gY + 10 * u); g.closePath(); g.fill();
    const rocks = []; for (let i = 0; i < 34; i++) { const y = H * (.74 + R() * .23), x = R() * W, s = H * .006 + (y - H * .72) / H * H * .06 * R(); if (Math.abs(x - cx) < 32 * u && y < gY + 10 * u && y > gY - 12 * u) continue; rocks.push([x, y, s]); }
    rocks.sort((a, b) => a[1] - b[1]).forEach(([x, y, s]) => rock(g, R, x, y, s, .9 + R() * .15));
    drum(g, R, W * .66, H * .9, H * .14, H * .036);
    drum(g, R, W * .86, H * .855, H * .09, H * .028, .92);
    g.save(); g.translate(W * .16, H * .875); g.rotate(-.18); stoneBlock(g, R, -H * .07, -H * .03, H * .14, H * .05, .95); g.restore();
    g.save(); g.translate(W * .3, H * .79); g.rotate(.32); stoneBlock(g, R, -H * .05, -H * .015, H * .1, H * .03, .9); g.restore();
  });
}
function buildFore() {
  layers.fore = layer(g => { const R = rng(73);
    const fg = g.createLinearGradient(0, H * .9, 0, H + M); fg.addColorStop(0, 'rgba(20,8,5,0)'); fg.addColorStop(1, 'rgba(14,5,3,.85)'); g.fillStyle = fg; g.fillRect(-M, H * .9, W + 2 * M, H * .1 + M);
    rock(g, R, W * .02, H * 1.0, H * .075, .7); rock(g, R, W * .11, H * 1.01, H * .045, .65);
    rock(g, R, W * .98, H * 1.01, H * .07, .6);
  });
}

/* ---------- the lamp (stone parts) ---------- */
function buildLamp() {
  const [c, g] = mk(W, H); lampC = c; const R = rng(97); runes = []; cracks = [];
  chBot = gY - 34 * u; chTop = gY - 82 * u;
  const lgrad = (x0, x1) => { const gr = g.createLinearGradient(x0, 0, x1, 0); gr.addColorStop(0, '#d8a87c'); gr.addColorStop(.32, '#a8774f'); gr.addColorStop(.7, '#5e3826'); gr.addColorStop(1, '#2a160e'); return gr; };
  /* pedestal */
  stoneBlock(g, R, cx - 28 * u, gY - 5.5 * u, 56 * u, 6 * u);
  g.fillStyle = 'rgba(30,12,6,.35)'; g.fillRect(cx - 28 * u, gY - 2.6 * u, 56 * u, .5 * u);
  /* base body */
  g.beginPath(); g.moveTo(cx - 22 * u, gY - 5.5 * u); g.quadraticCurveTo(cx - 12.5 * u, gY - 16 * u, cx - 11 * u, gY - 31 * u); g.lineTo(cx + 11 * u, gY - 31 * u); g.quadraticCurveTo(cx + 12.5 * u, gY - 16 * u, cx + 22 * u, gY - 5.5 * u); g.closePath();
  g.fillStyle = lgrad(cx - 22 * u, cx + 22 * u); g.fill(); g.save(); g.clip();
  speckle(g, R, cx - 22 * u, gY - 31 * u, 44 * u, 26 * u, u * u * 90, .25, .14);

  g.strokeStyle = 'rgba(25,10,5,.45)'; g.lineWidth = .35 * u; g.beginPath(); for (let i = 0; i <= 22; i++) { const x = cx - 22 * u + i * 2 * u, y = gY - (i % 2 ? 7 : 10) * u; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();

  g.fillStyle = '#2a160e'; g.beginPath(); g.moveTo(cx + 16 * u, gY - 5.5 * u); g.lineTo(cx + 19 * u, gY - 9 * u); g.lineTo(cx + 22 * u, gY - 5.5 * u); g.closePath(); g.fill();

}
function vesselPath(g) {

/* ---------- the creature ---------- */

/* ---------- pointer ---------- */
let P = null, Ps = {x: 0, y: 0}, lastMove = -1e9, started = false;
const setP = e => { P = {x: e.clientX, y: e.clientY}; lastMove = performance.now(); if (!started) { started = true; setTimeout(() => hint.classList.add('gone'), 4500); } };

/* ---------- dust ---------- */
let dust = [];
function buildDust() { const R = rng(5); dust = Array.from({length: W < 600 ? 55 : 95}, () => ({x: R() * W, y: H * (.25 + R() * .75), s: .6 + R() * 1.8, v: 6 + R() * 18, ph: R() * 6, a: .15 + R() * .35})); }

function layout() {

  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(layout, 150); });
layout();

/* ---------- eyes ---------- */

}

/* ---------- frame ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000), t = now / 1000 * (reduce ? .4 : 1); last = now;
  const idle = now - lastMove > 4500;
  const target = (!P || idle) ? {x: cx + Math.sin(t * .23) * W * .4, y: gY - L * .55 + Math.sin(t * .51) * L * .22} : P;
  Ps.x = lerp(Ps.x, target.x, idle || !P ? .03 : .2); Ps.y = lerp(Ps.y, target.y, idle || !P ? .03 : .2);

  ctx.drawImage(layers.mid, -M - ox * 36, -M - oy * 12, W + 2 * M, H + 2 * M);
  ctx.drawImage(layers.ground, -M, -M, W + 2 * M, H + 2 * M);

  ctx.fillStyle = gg; ctx.save(); ctx.translate(cx, gY); ctx.scale(1, .26); ctx.translate(-cx, -gY); ctx.beginPath(); ctx.arc(cx, gY, 52 * u, 0, 7); ctx.fill(); ctx.restore(); ctx.restore();

  ctx.fillStyle = 'rgba(255,220,180,.28)'; ctx.beginPath(); ctx.ellipse(bxS - 3.6 * u, byS - 4.3 * u, 2.2 * u, 1 * u, -.6, 0, 7); ctx.fill();
  for (const b of B.slice(10)) { ctx.fillStyle = 'rgba(255,215,170,.3)'; ctx.beginPath(); ctx.ellipse(cx + (b[0] - b[2] * .35) * u, chBot - (b[1] + b[2] * .4) * u, b[2] * .32 * u, b[2] * .16 * u, -.6, 0, 7); ctx.fill(); }
  /* the eyes */
  const re = 2.05 * u, eyY = byS - 1.2 * u;
  eye(bxS - 3.2 * u, eyY, re, cl['-1'], Ps.x, Ps.y, t);

  ctx.beginPath(); ctx.moveTo(bxS - 1.4 * u + side * .4 * u, byS + 2.3 * u); ctx.quadraticCurveTo(bxS + side * .5 * u, byS + (2.6 + mo * .6) * u, bxS + 1.4 * u + side * .4 * u, byS + 2.2 * u); ctx.stroke();

  gl.addColorStop(0, 'rgba(0,0,0,.55)'); gl.addColorStop(.12, 'rgba(0,0,0,.08)'); gl.addColorStop(.2, 'rgba(255,235,215,.24)'); gl.addColorStop(.26, 'rgba(255,235,215,.02)'); gl.addColorStop(.78, 'rgba(255,200,170,.0)'); gl.addColorStop(.84, 'rgba(255,200,170,.12)'); gl.addColorStop(.9, 'rgba(0,0,0,.1)'); gl.addColorStop(1, 'rgba(0,0,0,.6)');

  gg = ctx.createRadialGradient(cx, chBot - 22 * u, 4 * u, cx, chBot - 22 * u, 80 * u); gg.addColorStop(0, `rgba(255,70,25,${.2 * pulse})`); gg.addColorStop(.4, `rgba(255,50,20,${.08 * pulse})`); gg.addColorStop(1, 'rgba(255,40,20,0)');
  ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  runes.forEach((gl2, i) => { const a = .45 + .4 * Math.sin(t * 1.4 + i * .9) * pulse; ctx.strokeStyle = `rgba(255,${80 + i * 6},30,${a})`; ctx.shadowColor = 'rgba(255,60,20,.9)'; ctx.shadowBlur = 1.6 * u; ctx.lineWidth = .32 * u;
    gl2.forEach(seg => { ctx.beginPath(); seg.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); }); });

}
requestAnimationFrame(frame);
})();
