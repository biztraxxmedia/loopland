<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Abyssal Bloom — a ten-second, deterministic WebGL2 reef nocturne. All geometry, materials and light are made in this file.">
<link rel="icon" href="data:,">
<title>Abyssal Bloom</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010609}
body{position:fixed;inset:0}canvas{display:block;width:100vw;height:100vh;width:100dvw;height:100dvh}
</style>
</head>
<body>
<canvas aria-label="A luminous sea-fan reef, breathing in the deep ocean"></canvas>
<!--
  ABYSSAL BLOOM · a living-light nocturne 
  Raw WebGL2. No network, libraries, assets, clocks or frame integration.

  LOOP CONTRACT
  L = 10. The RAF timestamp produces p; the shaders receive only cos(A),
  sin(A), cos(2A), sin(2A), cos(3A), sin(3A). There is no shader time.
  The exact endpoint is canonicalized to zero before evaluating trig.
  ?t=0.37 freezes the entire image, including grain, at that phase.
  ?quality=2 is an optional full-DPR still-render mode (DPR cap 2).

  METHOD
  Deterministic space-colonization grows two reticulated gorgonian skeletons.
  A startup Euclidean transform bakes tapered-capsule distance fields. The
  fragment shader raymarches those tubular fields in three-dimensional,
  continuously bent fan planes, together with an eroded limestone ledge
  and a displaced seabed. This is geometry, rather than a picture on a quad.
  Colored area lights, soft shadows, AO, porous normal detail, wet specular
  reflection, polyp emission and participating-water light build the image.
  Three physical particle strata, two bloom radii, ACES and fixed film grain
  finish it. All animated quantities are periodic functions of the phase.
-->
<script>
'use strict';
(() => {
  const canvas = document.querySelector('canvas');
  const gl = canvas.getContext('webgl2', {
    alpha:false, antialias:false, depth:false, stencil:false,
    premultipliedAlpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance'
  });
  if (!gl) { console.error('Abyssal Bloom requires WebGL2.'); return; }
  const params = new URLSearchParams(location.search);
  const freezeValue = params.get('t');
  const freezeNumber = freezeValue === null ? NaN : Number(freezeValue);
  const frozenPhase = Number.isFinite(freezeNumber) ? ((freezeNumber % 1) + 1) % 1 : null;
  const stillQuality = params.get('quality') === '2';
  const floatColor = !!gl.getExtension('EXT_color_buffer_float');
  const floatLinear = !!gl.getExtension('OES_texture_float_linear');
  const FIELD_SIZE = 768;
  const FIELD_X0 = -1.55, FIELD_Y0 = -.14;
  const FIELD_W = 3.10, FIELD_H = 3.34;
  const TAU = Math.PI * 2;

  // The only PRNG is instantiated once, and consumed only during startup.
  function mulberry32(seed) {
    return function() {
      let n = seed += 0x6D2B79F5;
      n = Math.imul(n ^ n >>> 15, n | 1);
      n ^= n + Math.imul(n ^ n >>> 7, n | 61);
      return ((n ^ n >>> 14) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(0xA8B1055A);

  function growFan(variant) {
    const targets = [];
    for (let i=0;i<1750;i++) {
      const a = rng()*TAU, r = Math.sqrt(rng());
      const x = Math.cos(a)*r*(1.14+.05*variant);
      const y = 1.65 + Math.sin(a)*r*1.27;
      if (y > .39 + .12*Math.abs(x)) targets.push({x,y,alive:true});
    }
    const nodes = [
      {x:0,y:0,parent:-1,arc:0},
      {x:.012,y:.17,parent:0,arc:.17},
      {x:-.008,y:.34,parent:1,arc:.3412}
    ];
    const gridStep=.15;
    function gridKey(x,y){return (Math.floor(x/gridStep)+24)+(Math.floor(y/gridStep)+8)*64;}
    function makeGrid(){
      const grid=new Map();
      for(let i=0;i<nodes.length;i++){const key=gridKey(nodes[i].x,nodes[i].y);let cell=grid.get(key);if(!cell){cell=[];grid.set(key,cell);}cell.push(i);}
      return grid;
    }
    for (let turn=0;turn<145;turn++) {
      const n = nodes.length;
      const grid=makeGrid();
      const ax = new Float64Array(n), ay = new Float64Array(n), votes = new Uint16Array(n);
      let live = 0;
      for (const t of targets) {
        if (!t.alive) continue;
        let best=.61*.61, near=-1;
        const key=gridKey(t.x,t.y);
        for(let gy=-5;gy<=5;gy++)for(let gx=-5;gx<=5;gx++){
          const cell=grid.get(key+gx+gy*64);if(!cell)continue;
          for(const j of cell){
            const dx=t.x-nodes[j].x, dy=t.y-nodes[j].y, d=dx*dx+dy*dy;
            if(d<best){best=d;near=j;}
          }
        }
        if (best < .043*.043) {t.alive=false;continue;}
        live++;
        if (near >= 0) {
          const inv=1/Math.sqrt(best);
          ax[near]+=(t.x-nodes[near].x)*inv;
          ay[near]+=(t.y-nodes[near].y)*inv;
          votes[near]++;
        }
      }
      let added=0;
      for (let j=0;j<n;j++) {
        if (!votes[j]) continue;
        let dx=ax[j]/votes[j], dy=ay[j]/votes[j]+.035;
        const inv=.043/Math.hypot(dx,dy);
        dx*=inv;dy*=inv;
        const x=nodes[j].x+dx, y=nodes[j].y+dy;
        let duplicate=false;
        const key=gridKey(x,y);
        for(let gy=-1;gy<=1;gy++)for(let gx=-1;gx<=1;gx++){
          const cell=grid.get(key+gx+gy*64);if(!cell)continue;
          for(const k of cell){if(k===j)continue;const ex=x-nodes[k].x,ey=y-nodes[k].y;if(ex*ex+ey*ey<.016*.016){duplicate=true;break;}}
        }
        if (!duplicate) {
          let cell=grid.get(key);if(!cell){cell=[];grid.set(key,cell);}cell.push(nodes.length);
          nodes.push({x,y,parent:j,arc:nodes[j].arc+.043});added++;
        }
      }
      if(!added || !live || nodes.length>3600)break;
    }
    const loads=new Float64Array(nodes.length).fill(1);
    for(let i=nodes.length-1;i>0;i--) loads[nodes[i].parent]+=loads[i];
    const radii=Array.from(loads,v=>.0066+.039*Math.pow(v/loads[0],.67));
    const segments=[];
    function add(a,b,ra,rb,tag) {
      segments.push({ax:a.x,ay:a.y,bx:b.x,by:b.y,ra,rb,
        arc:a.arc,span:b.arc-a.arc,tag,
        x0:Math.min(a.x-ra,b.x-rb),y0:Math.min(a.y-ra,b.y-rb),
        x1:Math.max(a.x+ra,b.x+rb),y1:Math.max(a.y+ra,b.y+rb)});
    }
    for(let i=1;i<nodes.length;i++) {
      const p=nodes[i].parent;
      add(nodes[p],nodes[i],radii[p],radii[i],rng());
    }
    add({x:0,y:-.13,arc:0},nodes[0],.060,radii[0],rng());

    // Irregular Voronoi areoles: the fine reticulated tissue between the
    // load-bearing branches. Shared vertices keep every vein continuous.
    const sites=[{x:-12,y:-9},{x:12,y:-9},{x:0,y:15}];
    function circum(a,b,c){
      const u=sites[a],v=sites[b],w=sites[c];
      const den=2*(u.x*(v.y-w.y)+v.x*(w.y-u.y)+w.x*(u.y-v.y));
      if(Math.abs(den)<1e-10)return null;
      const uu=u.x*u.x+u.y*u.y,vv=v.x*v.x+v.y*v.y,ww=w.x*w.x+w.y*w.y;
      const x=(uu*(v.y-w.y)+vv*(w.y-u.y)+ww*(u.y-v.y))/den;
      const y=(uu*(w.x-v.x)+vv*(u.x-w.x)+ww*(v.x-u.x))/den;
      return {a,b,c,x,y,r2:(x-u.x)*(x-u.x)+(y-u.y)*(y-u.y)};
    }
    let triangles=[circum(0,1,2)];
    for(let row=0;row<44;row++)for(let col=0;col<34;col++){
      let x=-1.33+col*.081+(row%2)*.0405+(rng()-.5)*.043;
      let y=.25+row*.065+(rng()-.5)*.035;
      x+=.021*Math.sin(y*4.1+x*2.3);y+=.012*Math.sin(x*7.3+y*2.);
      if((x/1.32)**2+((y-1.65)/1.42)**2>1.12)continue;
      const id=sites.length;sites.push({x,y});
      const edges=new Map(),kept=[];
      for(const tri of triangles){
        if((x-tri.x)**2+(y-tri.y)**2<tri.r2){
          for(const [a,b] of [[tri.a,tri.b],[tri.b,tri.c],[tri.c,tri.a]]){
            const key=Math.min(a,b)+','+Math.max(a,b);
            if(edges.has(key))edges.delete(key);else edges.set(key,[a,b]);
          }
        }else kept.push(tri);
      }
      for(const [a,b] of edges.values()){const tri=circum(a,b,id);if(tri)kept.push(tri);}
      triangles=kept;
    }
    function insideCanopy(v){
      const edge=Math.sqrt(Math.max(0,1-((v.y-1.65)/1.25)**2))*1.13;
      const taper=Math.max(0,Math.min(1,(v.y-.38)/.45));
      return v.y>.48&&v.y<2.88&&Math.abs(v.x)<edge*taper*(1+.022*Math.sin(v.y*21.));
    }
    const adjacent=new Map();
    for(const tri of triangles){
      if(tri.a<3||tri.b<3||tri.c<3||!insideCanopy(tri))continue;
      for(const [a,b] of [[tri.a,tri.b],[tri.b,tri.c],[tri.c,tri.a]]){
        const key=Math.min(a,b)+','+Math.max(a,b),other=adjacent.get(key);
        if(other){
          const len=Math.hypot(tri.x-other.x,tri.y-other.y);
          if(len>.009&&len<.145){
            const arc=v=>Math.hypot(v.x*.57,v.y)+.065*Math.sin(v.y*2.7+v.x*1.3);
            const ra=.0039+rng()*.0017;
            add({...other,arc:arc(other)},{...tri,arc:arc(tri)},ra,ra*.94,rng());
          }
        }else adjacent.set(key,tri);
      }
    }
    // Anastomosis: delicate cross-veins make living lace, not a leafless tree.
    const stitched=new Uint8Array(nodes.length);
    const finalGrid=makeGrid();
    for(let i=5;i<nodes.length;i++) {
      if(nodes[i].y<.52 || stitched[i])continue;
      let near=-1, best=.098;
      const key=gridKey(nodes[i].x,nodes[i].y);
      for(let gy=-1;gy<=1;gy++)for(let gx=-1;gx<=1;gx++){
        const cell=finalGrid.get(key+gx+gy*64);if(!cell)continue;
        for(const j of cell){
          if(j<=i||stitched[j]||nodes[j].parent===i||nodes[i].parent===j)continue;
          if(Math.abs(nodes[i].arc-nodes[j].arc)<.13)continue;
          const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);
          if(d<best&&d>.025){best=d;near=j;}
        }
      }
      if(near>=0) {
        const b={...nodes[near],arc:nodes[i].arc+best};
        add(nodes[i],b,.0053,.0053,rng());
        stitched[i]=stitched[near]=1;
      }
    }
    // Minute corallites break the edges, and remain attached to the skeleton.
    for(let i=7;i<nodes.length;i+=5) {
      const a=nodes[i], b=nodes[a.parent];
      const dx=a.x-b.x,dy=a.y-b.y, len=Math.hypot(dx,dy);
      const side=rng()<.5?-1:1, reach=.010+rng()*.012;
      const t={x:a.x+side*dy/len*reach,y:a.y-side*dx/len*reach+.008,arc:a.arc+reach};
      add(a,t,.0041,.0025,rng());
    }
    return segments;
  }

  function bakeField(segments) {
    const n=FIELD_SIZE,total=n*n,field=new Float32Array(total*4);
    const owner=new Int32Array(total).fill(-1),nearD=new Float32Array(total).fill(1e5);
    const dx=FIELD_W/n,dy=FIELD_H/n,band=.019;
    // Exact capsule rasterization in the surface band. This band is wider
    // than a marcher's final step, so the rendered zero set is exact.
    for(let id=0;id<segments.length;id++){
      const s=segments[id],vx=s.bx-s.ax,vy=s.by-s.ay,inv=1/(vx*vx+vy*vy);
      const xa=Math.max(0,Math.floor((s.x0-band-FIELD_X0)/dx));
      const xb=Math.min(n-1,Math.ceil((s.x1+band-FIELD_X0)/dx));
      const ya=Math.max(0,Math.floor((s.y0-band-FIELD_Y0)/dy));
      const yb=Math.min(n-1,Math.ceil((s.y1+band-FIELD_Y0)/dy));
      for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++){
        const px=FIELD_X0+(x+.5)*dx-s.ax,py=FIELD_Y0+(y+.5)*dy-s.ay;
        const h=Math.max(0,Math.min(1,(px*vx+py*vy)*inv));
        const ex=px-vx*h,ey=py-vy*h;
        const d=Math.sqrt(ex*ex+ey*ey)-(s.ra+(s.rb-s.ra)*h),i=y*n+x;
        if(d<nearD[i]){nearD[i]=d;owner[i]=id;}
      }
    }
    const verticalD=new Float32Array(total).fill(1e9),verticalOwner=new Int32Array(total).fill(-1);
    for(let x=0;x<n;x++){
      let last=-n*2,id=-1;
      for(let y=0;y<n;y++){
        const i=y*n+x;if(owner[i]>=0){last=y;id=owner[i];}
        if(id>=0){verticalD[i]=(y-last)*(y-last);verticalOwner[i]=id;}
      }
      last=n*3;id=-1;
      for(let y=n-1;y>=0;y--){
        const i=y*n+x;if(owner[i]>=0){last=y;id=owner[i];}
        const d=(y-last)*(y-last);
        if(id>=0&&d<verticalD[i]){verticalD[i]=d;verticalOwner[i]=id;}
      }
    }
    // Linear-time lower envelopes of parabolas fill the empty water around
    // the surface band, retaining the nearest tapered-capsule identity.
    const v=new Int32Array(n),z=new Float64Array(n+1);
    for(let y=0;y<n;y++){
      const base=y*n;let k=-1;
      for(let q=0;q<n;q++){
        const f=verticalD[base+q];if(f>=1e9)continue;
        let edge=-Infinity;
        while(k>=0){
          const j=v[k];edge=((f+q*q)-(verticalD[base+j]+j*j))/(2*(q-j));
          if(edge>z[k])break;k--;
        }
        k++;v[k]=q;z[k]=k===0?-Infinity:edge;z[k+1]=Infinity;
      }
      let which=0;
      for(let x=0;x<n;x++){
        while(z[which+1]<x)which++;
        const i=base+x;
        if(owner[i]<0)owner[i]=verticalOwner[base+v[which]];
        const s=segments[owner[i]],vx=s.bx-s.ax,vy=s.by-s.ay;
        const px=FIELD_X0+(x+.5)*dx-s.ax,py=FIELD_Y0+(y+.5)*dy-s.ay;
        const h=Math.max(0,Math.min(1,(px*vx+py*vy)/(vx*vx+vy*vy)));
        const r=s.ra+(s.rb-s.ra)*h,ex=px-vx*h,ey=py-vy*h;
        field[i*4]=Math.sqrt(ex*ex+ey*ey)-r;field[i*4+1]=r;
        field[i*4+2]=s.arc+s.span*h;field[i*4+3]=s.tag;
      }
    }
    return field;
  }

  const fullVS=`#version 300 es
  precision highp float;
  out vec2 kUV;
  void main(){
    vec2 kV=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
    kUV=kV;gl_Position=vec4(kV*2.-1.,0.,1.);
  }`;

  const sceneFS=`#version 300 es
  precision highp float;
  precision highp sampler2DArray;
  in vec2 kUV;
  layout(location=0) out vec4 kFrag;
  uniform vec2 kResolution;
  uniform vec2 kCycle1,kCycle2,kCycle3;
  uniform vec3 kEye,kRight,kUp,kForward;
  uniform sampler2DArray kFields;
  const float kFocal=1.67;
  const vec3 kMint=vec3(.075,1.,.28);
  const vec3 kTeal=vec3(.025,.57,.64);
  const vec3 kRose=vec3(1.,.125,.33);
  const vec3 kIndigo=vec3(.095,.15,.39);

  float kHash31(vec3 kP){
    kP=fract(kP*.1031);kP+=dot(kP,kP.yzx+33.33);
    return fract((kP.x+kP.y)*kP.z);
  }
  float kN3(vec3 kP){
    vec3 kI=floor(kP),kF=fract(kP);kF=kF*kF*(3.-2.*kF);
    return mix(mix(mix(kHash31(kI),kHash31(kI+vec3(1,0,0)),kF.x),mix(kHash31(kI+vec3(0,1,0)),kHash31(kI+vec3(1,1,0)),kF.x),kF.y),
      mix(mix(kHash31(kI+vec3(0,0,1)),kHash31(kI+vec3(1,0,1)),kF.x),mix(kHash31(kI+vec3(0,1,1)),kHash31(kI+vec3(1,1,1)),kF.x),kF.y),kF.z);
  }
  float kFBM(vec3 kP){return .57*kN3(kP)+.28*kN3(kP*2.03+3.7)+.15*kN3(kP*4.11+11.2);}
  float kSin1(float kOffset){return kCycle1.y*cos(kOffset)+kCycle1.x*sin(kOffset);}
  float kSin2(float kOffset){return kCycle2.y*cos(kOffset)+kCycle2.x*sin(kOffset);}
  float kSin3(float kOffset){return kCycle3.y*cos(kOffset)+kCycle3.x*sin(kOffset);}
  mat2 kRot(float kA){float kS=sin(kA),kC=cos(kA);return mat2(kC,-kS,kS,kC);}
  float kBox(vec3 kP,vec3 kB){vec3 kQ=abs(kP)-kB;return length(max(kQ,0.))+min(max(kQ.x,max(kQ.y,kQ.z)),0.);}

  vec4 kField(vec2 kCoord,float kLayer){
    vec2 kTex=(kCoord-vec2(-1.55,-.14))/vec2(3.10,3.34);
    ${floatLinear ? 'return texture(kFields,vec3(kTex,kLayer));' : `
    vec2 kGrid=kTex*768.-.5;ivec2 kBase=ivec2(floor(kGrid));vec2 kWeight=fract(kGrid);
    ivec2 kLo=ivec2(0),kHi=ivec2(767);
    return mix(mix(texelFetch(kFields,ivec3(clamp(kBase,kLo,kHi),int(kLayer)),0),texelFetch(kFields,ivec3(clamp(kBase+ivec2(1,0),kLo,kHi),int(kLayer)),0),kWeight.x),
      mix(texelFetch(kFields,ivec3(clamp(kBase+ivec2(0,1),kLo,kHi),int(kLayer)),0),texelFetch(kFields,ivec3(clamp(kBase+ivec2(1,1),kLo,kHi),int(kLayer)),0),kWeight.x),kWeight.y);`}
  }
  vec3 kFanSpace(vec3 kP,int kId){
    if(kId==0){kP-=vec3(.28,-.54,-.13);kP.xz=kRot(-.12)*kP.xz;}
    else if(kId==1){kP-=vec3(-.77,-.55,.20);kP.xz=kRot(.40)*kP.xz;kP.xy=kRot(-.18)*kP.xy;kP/=.68;}
    else {kP-=vec3(.94,-.54,.25);kP.xz=kRot(-.53)*kP.xz;kP.xy=kRot(.28)*kP.xy;kP/=.43;}
    // Two complete sways per ten seconds. The rooted end does not translate.
    kP.x-=.020*kP.y*kP.y*kSin2(kP.y*.83+float(kId)*1.25);
    kP.z-=.057*kP.y*kSin2(kP.y*.72+float(kId)*1.7);
    kP.z-=.047*sin(kP.x*3.1+kP.y*1.8)+.030*cos(kP.y*3.4-kP.x*2.);
    return kP;
  }
  float kFanScale(int kId){return kId==0?1.:(kId==1?.68:.43);}
  float kFan(vec3 kP,int kId){
    vec3 kQ=kFanSpace(kP,kId);
    float kScale=kFanScale(kId);
    float kBound=kBox(kQ-vec3(0,1.48,0),vec3(1.53,1.61,.18));
    if(kBound>.16)return kBound*kScale*.77;
    vec4 kF=kField(kQ.xy,float(kId==1?1:0));
    float kRad=kF.y;
    float kTube=length(vec2(max(kF.x+kRad,0.),kQ.z))-kRad;
    return max(kTube,kBound-.02)*kScale*.77;
  }
  float kFloorY(vec2 kP){
    float kSediment=.12*exp(-kP.x*kP.x*.32-pow(kP.y-.12,2.)*2.4);
    return -.94+kSediment+.009*sin(kP.x*12.+kP.y*3.5)+.008*sin(kP.x*18.-kP.y*2.)+.027*kN3(vec3(kP*1.8,1.));
  }
  float kStone(vec3 kP){
    kP.xz=kRot(.23)*kP.xz;
    float kRidge=kP.z+.12*sin(kP.x*2.1)+.06*sin(kP.x*6.);
    float kOutline=max(abs(kRidge)-(.39+.055*sin(kP.x*4.2+.8)),abs(kP.x)-1.54);
    kOutline=max(kOutline,dot(kP.xz,normalize(vec2(.79,.61)))-1.25);
    kOutline=max(kOutline,dot(kP.xz,normalize(vec2(-.85,-.53)))-1.30);
    kOutline+=(kP.y+.60)*.87;
    float kTop=-.67+.085*sin(kP.x*1.9+1.)+.065*kFBM(kP*7.);
    kOutline+=.028*(kFBM(kP*18.)-.5);
    float kD=max(kOutline,kP.y-kTop)-.018;
    kD+=.025*(kFBM(kP*11.)-.5)+.003*sin(kP.y*132.+kN3(kP*14.)*2.);
    return kD*.82;
  }
  float kPlate(vec3 kP){
    kP-=vec3(-.85,-.54,.37);kP.xz=kRot(-.38)*kP.xz;
    float kTheta=atan(kP.z,kP.x),kR=length(kP.xz);
    float kEdge=.34+.035*sin(kTheta*7.)+.019*sin(kTheta*11.+.7);
    float kBowl=.13*pow(kR/.34,1.8)+.018*sin(kTheta*7.)*smoothstep(.08,.33,kR);
    return max(abs(kP.y-kBowl)-.016,kR-kEdge)*.78;
  }
  vec2 kMap(vec3 kP){
    vec2 kResult=vec2(kP.y-kFloorY(kP.xz),4.);
    float kD=kStone(kP);if(kD<kResult.x)kResult=vec2(kD,3.);
    kD=kPlate(kP);if(kD<kResult.x)kResult=vec2(kD,5.);
    for(int kId=0;kId<3;kId++){kD=kFan(kP,kId);if(kD<kResult.x)kResult=vec2(kD,float(kId));}
    return kResult;
  }
  vec3 kNormal(vec3 kP,float kE){

  function texUnit(tex,index,type=gl.TEXTURE_2D){gl.activeTexture(gl.TEXTURE0+index);gl.bindTexture(type,tex);}
  function use(p){gl.useProgram(p.p);}
  function vec2(p,n,x,y){if(p.u[n]!==undefined&&p.u[n]!==null)gl.uniform2f(p.u[n],x,y);}
  function vec3(p,n,v){if(p.u[n]!==undefined&&p.u[n]!==null)gl.uniform3fv(p.u[n],v);}
  function integer(p,n,x){if(p.u[n]!==undefined&&p.u[n]!==null)gl.uniform1i(p.u[n],x);}
  function bindTarget(t){gl.bindFramebuffer(gl.FRAMEBUFFER,t?t.fb:null);gl.viewport(0,0,t?t.w:width,t?t.h:height);}
  function screen(){gl.bindVertexArray(fullVAO);gl.drawArrays(gl.TRIANGLES,0,3);}
  function blurPass(src,dst,dx,dy,extract){
    bindTarget(dst);use(bloom);texUnit(src.tex,0);integer(bloom,'kSource',0);
    vec2(bloom,'kTexel',1/src.w,1/src.h);vec2(bloom,'kDirection',dx,dy);integer(bloom,'kExtract',extract);screen();
  }
  let renderedPhase=0;
  function renderPhase(value){
    resize();
    // This normalization makes renderPhase(0) and renderPhase(1) bit-identical.
    const p=((value%1)+1)%1,A=TAU*p;
    const cycles=[[Math.cos(A),Math.sin(A)],[Math.cos(2*A),Math.sin(2*A)],[Math.cos(3*A),Math.sin(3*A)]];
    const view=camera(cycles[0][0],cycles[0][1]);
    for(const prog of [scene,particles]){
      use(prog);vec2(prog,'kResolution',width,height);
      for(let i=0;i<3;i++)vec2(prog,'kCycle'+(i+1),...cycles[i]);
      vec3(prog,'kEye',view.eye);vec3(prog,'kRight',view.right);vec3(prog,'kUp',view.up);vec3(prog,'kForward',view.forward);
    }
    gl.disable(gl.BLEND);bindTarget(targets[0]);use(scene);
    texUnit(fanTexture,0,gl.TEXTURE_2D_ARRAY);integer(scene,'kFields',0);screen();

    // The scene is copied before particle blending, avoiding texture feedback.
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER,targets[0].fb);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,targets[1].fb);
    gl.blitFramebuffer(0,0,width,height,0,0,width,height,gl.COLOR_BUFFER_BIT,gl.NEAREST);
    bindTarget(targets[1]);use(particles);texUnit(targets[0].tex,0);integer(particles,'kScene',0);
    gl.enable(gl.BLEND);gl.blendEquation(gl.FUNC_ADD);gl.blendFuncSeparate(gl.ONE,gl.ONE,gl.ZERO,gl.ONE);
    gl.bindVertexArray(particleVAO);gl.drawArrays(gl.POINTS,0,particleCount);gl.disable(gl.BLEND);

    blurPass(targets[1],targets[2],1.3,0,1);blurPass(targets[2],targets[3],0,1.3,0);
    blurPass(targets[3],targets[4],2.4,0,0);blurPass(targets[4],targets[5],0,2.4,0);
    bindTarget(null);use(post);texUnit(targets[1].tex,0);texUnit(targets[3].tex,1);texUnit(targets[5].tex,2);
    integer(post,'kSource',0);integer(post,'kBloom',1);integer(post,'kWideBloom',2);vec2(post,'kResolution',width,height);screen();
    renderedPhase=p;
  }
  let running=true,raf=0,ready=false;
  function frame(timestamp){
    if(!running||document.hidden){raf=0;return;}
    // The RAF timestamp is the only clock. No Date, performance.now or dt.
    const p=frozenPhase===null?((timestamp/1000%10)/10):frozenPhase;
    renderPhase(p);ready=true;
    if(frozenPhase===null)raf=requestAnimationFrame(frame);else raf=0;
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;}
    else if(running&&!raf)raf=requestAnimationFrame(frame);
  });
  addEventListener('resize',()=>{if(frozenPhase!==null&&ready)renderPhase(frozenPhase);});
  canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();running=false;console.error('WebGL context lost. Reload to restore the reef.');});
  // A silent inspection/export hook. It never draws UI or advances a clock.
  Object.defineProperty(window,'__reef',{value:Object.freeze({
    renderPhase,
    pause(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;},
    resume(){if(running)return;running=true;if(!raf)raf=requestAnimationFrame(frame);},
    get ready(){return ready;},get phase(){return renderedPhase;},
    get info(){return {loopSeconds:10,width,height,segmentCounts:segmentCounts.slice(),floatColor,floatLinear};}
  })});
  raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
