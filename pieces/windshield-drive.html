<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="icon" href="data:,"></head><body>
<title>Windshield Drive</title>
<meta name="claude:viewport-fit-sides" content="cover">


<style>
/* Layout: one full-bleed canvas = driver's-seat view through a windshield. A dash-mounted Day/Night switch is the only control. Single committed look (the scene owns its own day/night), so no theme blocks. */
:root{
  --chrome:#e9ecef; --steel:#8c929b; --red:#c8202e; --ink:#0b0b0d; --panel:#16171a; --dim:rgba(233,236,239,.62);
  --display:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;
  --body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--chrome);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:var(--body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
.switch{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 4vw));bottom:calc(env(safe-area-inset-bottom,0px) + 3.2vh);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:14px;
  background:linear-gradient(180deg,#26272b,#141518);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.55);z-index:5}
.switch .lbl{font-family:var(--display);letter-spacing:.14em;font-size:14px;color:var(--dim)}
.seg{position:relative;display:flex;background:#0a0a0c;border-radius:10px;padding:3px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8)}
.seg button{position:relative;z-index:1;appearance:none;border:0;background:none;color:var(--steel);font:700 13px/1 var(--body);letter-spacing:.06em;padding:9px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:color .3s}
.seg button[aria-pressed="true"]{color:#fff}
.seg button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:8px;background:linear-gradient(180deg,#e0303d,var(--red));box-shadow:0 0 14px rgba(200,32,46,.6),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .45s cubic-bezier(.6,.05,.25,1)}
.seg[data-mode="night"] .thumb{transform:translateX(100%)}
.seg svg{width:14px;height:14px}
.hint{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 9vw));top:calc(env(safe-area-inset-top,0px) + 7vh);font-family:var(--display);letter-spacing:.2em;font-size:15px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7);pointer-events:none;transition:opacity 1.4s;z-index:4}
.hint.gone{opacity:0}
@media (max-width:520px){.switch .lbl{display:none}.seg button{padding:9px 11px}}
</style>

<canvas id="c" aria-label="View from the driver's seat through a windshield, cruising a two-lane Kentucky highway. Switch between day and night."></canvas>
<div class="hint" id="hint">Move to steer · flip the switch</div>
<div class="switch">
  <span class="lbl">Headlights</span>
  <div class="seg" id="seg" data-mode="day" role="group" aria-label="Time of day">
    <span class="thumb"></span>
    <button id="bDay" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>Day</button>
    <button id="bNight" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Night</button>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, dpr, hor, stars = [], clouds = [], specks = [];
const S = {m: 0, mT: 0, travel: 0, speed: 1, steer: 0, steerT: 0, curve: 0, curveT: 0, nextCurve: 3, heading: 0, sw: 0, swv: 0, prevLean: 0, brake: 0, t: 0};
const R = Math.random, lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* palette: [day, night] */
const P = {
  skyT: [[54,124,220],[3,5,16]], skyB: [[190,222,250],[34,20,54]],
  hillF: [[122,152,182],[15,15,30]], hillN: [[78,116,92],[9,10,18]], tline: [[52,94,62],[6,7,11]],
  g1: [[92,146,70],[11,17,13]], g2: [[83,136,63],[9,14,11]],
  r1: [[150,146,138],[34,33,34]], r2: [[138,134,126],[30,29,30]],
  rd1: [[100,102,108],[25,25,29]], rd2: [[94,96,102],[22,22,26]],
  line: [[246,246,240],[150,150,140]], yel: [[244,198,40],[150,118,30]],
  inner: [[30,31,35],[9,9,11]], car: [[54,60,72],[13,13,16]]
};
const mixA = (k, t = S.m) => { const a = P[k][0], b = P[k][1]; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; };
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const C = (k, a) => rgb(mixA(k), a);

/* ---------- world ---------- */
const roadHalf = p => p * W * (W < 700 ? 0.95 : 0.62);
const center = p => W / 2 + S.curve * (1 - p) * (1 - p) * W * 0.42 - roadHalf(p) * (0.46 + S.steer * 0.22);
const yOf = p => hor + p * (H - hor);

let objs = [];
function spawn(z) {
  const r = R(), side = R() < .5 ? -1 : 1;
  let type = r < .62 ? 'tree' : r < .9 ? 'lamp' : 'pole';
  if (R() < .05) type = 'sign';
  return {z, side: type === 'sign' ? 1 : side, type, seed: R(), lead: false, onc: false};
}
function initWorld() {
  objs = [];
  for (let i = 0; i < 34; i++) objs.push(spawn(0.6 + i * 1.35 + R()));
  objs.push({z: 4.4, lead: true});
}
let oncTimer = 4;

function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hor = H * 0.47;
  stars = Array.from({length: Math.round(W * H / 2600)}, () => ({x: R() * W, y: R() * hor, r: R() < .08 ? 1.5 : .8, tw: R() * 6}));
  clouds = Array.from({length: 7}, (_, i) => ({x: R() * W * 1.4 - W * .2, y: hor * (.12 + R() * .55), s: (40 + R() * 90) * Math.max(.6, W / 1400), v: 4 + R() * 7, n: 4 + (R() * 4 | 0), seed: R()}));
  specks = Array.from({length: 70}, () => ({x: R() * W, y: R() * H * .78, r: R() * 1.1 + .3, a: R() * .5}));
}
addEventListener('resize', () => { clearTimeout(layout.t); layout.t = setTimeout(layout, 120); });
layout(); initWorld();

/* ---------- sky ---------- */
function hillY(x, off, amp, f) { const u = (x + off) / W; return Math.sin(u * 5.1 * f + 1.3) * amp * .55 + Math.sin(u * 11.7 * f + .4) * amp * .3 + Math.sin(u * 23 * f) * amp * .15; }
function drawSky(t) {
  const m = S.m, dusk = Math.sin(m * Math.PI);
  const g = ctx.createLinearGradient(0, 0, 0, hor);
  g.addColorStop(0, C('skyT')); const b = mixA('skyB');
  g.addColorStop(1, rgb([lerp(b[0], 250, dusk * .7), lerp(b[1], 120, dusk * .6), lerp(b[2], 80, dusk * .6)]));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, hor + 2);
  if (m > .02) for (const s of stars) { ctx.fillStyle = `rgba(255,250,240,${m * (.45 + .55 * Math.sin(t * 1.3 + s.tw)) * (1 - s.y / hor * .6)})`; ctx.fillRect(s.x, s.y, s.r, s.r); }
  const ox = -S.heading * W * .04, sx = (W * .76 + ox) % (W * 1.6), sy = hor * .36, sr = Math.min(W, H) * .045;
  if (m < .98) {
    let sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 7); sg.addColorStop(0, `rgba(255,248,220,${.55 * (1 - m)})`); sg.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, hor);
    ctx.fillStyle = `rgba(255,252,236,${1 - m})`; ctx.beginPath(); ctx.arc(sx, sy + m * hor * .5, sr, 0, 7); ctx.fill();
  }
  if (m > .02) {
    const mx = W * .24 + ox * .6, my = hor * .3;
    let mg = ctx.createRadialGradient(mx, my, 0, mx, my, sr * 5); mg.addColorStop(0, `rgba(200,210,255,${.25 * m})`); mg.addColorStop(1, 'rgba(200,210,255,0)'); ctx.fillStyle = mg; ctx.fillRect(0, 0, W, hor);
    ctx.fillStyle = `rgba(236,236,226,${m})`; ctx.beginPath(); ctx.arc(mx, my, sr * .8, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(160,160,170,${m * .35})`; for (const [a, b, r] of [[-.25, -.1, .2], [.2, .25, .14], [.1, -.3, .1]]) { ctx.beginPath(); ctx.arc(mx + a * sr, my + b * sr, r * sr, 0, 7); ctx.fill(); }
  }
  for (const c of clouds) {
    const cx = c.x + ox * 1.5;
    const col = m < .5 ? `rgba(255,255,255,${.85 * (1 - m * 1.6)})` : `rgba(70,64,96,${.35 * m})`;
    ctx.fillStyle = col;
    for (let i = 0; i < c.n; i++) { const a = (i / c.n) * Math.PI; ctx.beginPath(); ctx.ellipse(cx + (i - c.n / 2) * c.s * .42, c.y - Math.sin(a) * c.s * .25, c.s * (.42 + (i % 2) * .1), c.s * .3, 0, 0, 7); ctx.fill(); }
    if (m < .6) { ctx.fillStyle = `rgba(160,180,210,${.25 * (1 - m)})`; ctx.beginPath(); ctx.ellipse(cx, c.y + c.s * .08, c.s * c.n * .22, c.s * .1, 0, 0, 7); ctx.fill(); }
  }
  /* hills */
  const off = S.heading * W * .25;
  ctx.fillStyle = C('hillF'); ctx.beginPath(); ctx.moveTo(0, hor + 2);
  for (let x = 0; x <= W; x += 6) ctx.lineTo(x, hor - H * .055 - hillY(x, off, H * .05, 1)); ctx.lineTo(W, hor + 2); ctx.fill();
  ctx.fillStyle = C('hillN'); ctx.beginPath(); ctx.moveTo(0, hor + 2);
  for (let x = 0; x <= W; x += 5) ctx.lineTo(x, hor - H * .022 - hillY(x, off * 1.8 + 300, H * .025, 1.7)); ctx.lineTo(W, hor + 2); ctx.fill();
  ctx.fillStyle = C('tline'); ctx.beginPath(); ctx.moveTo(0, hor + 2);
  for (let x = 0; x <= W; x += 3) { const n = Math.sin((x + off * 3) * .09) * .5 + Math.sin((x + off * 3) * .23) * .5; ctx.lineTo(x, hor - H * .006 - Math.abs(n) * H * .012); } ctx.lineTo(W, hor + 2); ctx.fill();
  if (dusk > .05) { const hg = ctx.createLinearGradient(0, hor - H * .08, 0, hor); hg.addColorStop(0, 'rgba(255,120,70,0)'); hg.addColorStop(1, `rgba(255,120,70,${dusk * .35})`); ctx.fillStyle = hg; ctx.fillRect(0, hor - H * .08, W, H * .08); }
}

/* ---------- road ---------- */
function drawRoad() {
  const g1 = C('g1'), g2 = C('g2'), r1 = C('r1'), r2 = C('r2'), d1 = C('rd1'), d2 = C('rd2'), ln = C('line'), yl = C('yel');
  const step = 2;
  for (let y = Math.ceil(hor); y < H; y += step) {
    const p = (y - hor) / (H - hor); if (p < .003) continue;
    const z = 1 / p, ph = z * 1.15 + S.travel, seg = Math.floor(ph) & 1;
    const c = center(p), h = roadHalf(p);
    ctx.fillStyle = seg ? g1 : g2; ctx.fillRect(0, y, W, step);
    ctx.fillStyle = seg ? r1 : r2; ctx.fillRect(c - h * 1.1, y, h * 2.2, step);
    ctx.fillStyle = seg ? d1 : d2; ctx.fillRect(c - h, y, h * 2, step);
    ctx.fillStyle = ln; ctx.fillRect(c - h * .965, y, h * .028, step); ctx.fillRect(c + h * .937, y, h * .028, step);
    if (((ph * .5) % 1 + 1) % 1 < .5) { ctx.fillStyle = yl; ctx.fillRect(c - h * .018, y, h * .036, step); }
  }
  const m = S.m;
  if (m > .02) { /* headlight wash */
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const cx = W / 2 + (center(.6) - W / 2) * .3, cy = hor + (H - hor) * .5;
    const hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, (H - hor) * .75);
    hg.addColorStop(0, `rgba(255,236,190,${.26 * m})`); hg.addColorStop(.5, `rgba(255,226,170,${.1 * m})`); hg.addColorStop(1, 'rgba(255,220,160,0)');
    ctx.fillStyle = hg; ctx.save(); ctx.translate(cx, cy); ctx.scale(1.6, .62); ctx.translate(-cx, -cy); ctx.beginPath(); ctx.arc(cx, cy, (H - hor) * .75, 0, 7); ctx.fill(); ctx.restore();
    ctx.restore();
  }
}

/* ---------- roadside + cars ---------- */
function drawTree(x, yb, s, seed) {
  const m = S.m, tr = [lerp(84, 10, m), lerp(60, 8, m), lerp(40, 8, m)];
  ctx.fillStyle = rgb(tr); ctx.fillRect(x - s * .03, yb - s * .3, s * .06, s * .3);
  const base = [lerp(40 + seed * 34, 7, m), lerp(96 + seed * 40, 10, m), lerp(46 + seed * 10, 12, m)];
  if (seed < .5) {
    ctx.fillStyle = rgb(base);
    for (const [dx, dy, r] of [[0, -.62, .26], [-.17, -.46, .2], [.17, -.47, .21], [0, -.38, .22]]) { ctx.beginPath(); ctx.arc(x + dx * s, yb + dy * s, r * s, 0, 7); ctx.fill(); }
    if (m < .7) { ctx.fillStyle = `rgba(190,230,140,${.22 * (1 - m)})`; ctx.beginPath(); ctx.arc(x + s * .08, yb - s * .66, s * .14, 0, 7); ctx.fill(); }
  } else {
    ctx.fillStyle = rgb([base[0] * .7, base[1] * .85, base[2] * .9]);
    for (let i = 0; i < 3; i++) { const w = s * (.34 - i * .08), yy = yb - s * (.2 + i * .22); ctx.beginPath(); ctx.moveTo(x - w, yy); ctx.lineTo(x, yy - s * .38); ctx.lineTo(x + w, yy); ctx.fill(); }
  }
}
function drawLamp(o, x, yb, s, p) {
  const m = S.m, armDir = -o.side, top = yb - s * 1.25;
  ctx.fillStyle = rgb([lerp(110, 22, m), lerp(112, 22, m), lerp(118, 26, m)]);
  ctx.fillRect(x - s * .012, top, s * .024, s * 1.25);
  const hx = x + armDir * roadHalf(p) * .42;
  ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(1, s * .016); ctx.beginPath(); ctx.moveTo(x, top + s * .02); ctx.quadraticCurveTo(x + armDir * s * .1, top - s * .06, hx, top); ctx.stroke();
  ctx.fillRect(hx - s * .05, top - s * .005, s * .1, s * .025);
  if (m > .02) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    let g = ctx.createRadialGradient(hx, top + s * .02, 0, hx, top + s * .02, s * .45); g.addColorStop(0, `rgba(255,214,150,${.9 * m})`); g.addColorStop(.2, `rgba(255,190,110,${.35 * m})`); g.addColorStop(1, 'rgba(255,180,100,0)');
    ctx.fillStyle = g; ctx.fillRect(hx - s * .5, top - s * .5, s, s);
    g = ctx.createRadialGradient(hx, yb, 0, hx, yb, s * .7); g.addColorStop(0, `rgba(255,200,130,${.32 * m})`); g.addColorStop(1, 'rgba(255,200,130,0)');
    ctx.fillStyle = g; ctx.save(); ctx.translate(hx, yb); ctx.scale(1, .16); ctx.beginPath(); ctx.arc(0, 0, s * .7, 0, 7); ctx.fill(); ctx.restore();
    ctx.restore();
  }
}
function drawPole(x, yb, s) {
  const m = S.m; ctx.fillStyle = rgb([lerp(96, 16, m), lerp(74, 13, m), lerp(54, 11, m)]);
  ctx.fillRect(x - s * .014, yb - s * 1.4, s * .028, s * 1.4); ctx.fillRect(x - s * .16, yb - s * 1.32, s * .32, s * .02);
  ctx.fillStyle = rgb([lerp(200, 40, m), lerp(200, 40, m), lerp(190, 40, m)]); for (const k of [-.13, -.04, .05, .13]) ctx.fillRect(x + k * s, yb - s * 1.345, s * .015, s * .025);
}
function drawSign(o, x, yb, s) {
  const m = S.m, w = s * 1.0, h = s * .44, top = yb - s * .95;
  ctx.fillStyle = rgb([lerp(130, 28, m), lerp(130, 28, m), lerp(136, 30, m)]);
  ctx.fillRect(x - w * .32, top + h, s * .02, yb - top - h); ctx.fillRect(x + w * .3, top + h, s * .02, yb - top - h);
  const lit = m * clamp(1 - (o.z - 3) / 8, 0, 1);
  ctx.fillStyle = rgb([lerp(14, 10, m) + lit * 10, lerp(110, 40, m) + lit * 80, lerp(66, 26, m) + lit * 46]);
  ctx.beginPath(); ctx.roundRect(x - w / 2, top, w, h, h * .08); ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${lerp(.95, .35, m) + lit * .6})`; ctx.lineWidth = Math.max(1, h * .035); ctx.beginPath(); ctx.roundRect(x - w / 2 + h * .06, top + h * .06, w - h * .12, h * .88, h * .06); ctx.stroke();
  if (w > 46) { ctx.fillStyle = ctx.strokeStyle; ctx.font = `700 ${Math.min(h * .26, w * .1)}px Montserrat, Arial, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('RUSSELL SPRINGS', x, top + h * .36); ctx.font = `700 ${h * .24}px Montserrat, Arial, sans-serif`; ctx.fillText('↑  3', x, top + h * .7); }
}
function carShape(x, yb, w, front) {
  const h = w * .72, m = S.m;
  ctx.fillStyle = `rgba(0,0,0,${lerp(.35, .55, m)})`; ctx.beginPath(); ctx.ellipse(x, yb, w * .58, w * .07, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#0c0c0e'; ctx.fillRect(x - w * .44, yb - h * .14, w * .16, h * .14); ctx.fillRect(x + w * .28, yb - h * .14, w * .16, h * .14);
  const body = front ? [[lerp(196, 18, m), lerp(198, 18, m), lerp(204, 22, m)]][0] : mixA('car');
  const bg = ctx.createLinearGradient(0, yb - h, 0, yb); bg.addColorStop(0, rgb(body.map(v => Math.min(255, v * 1.35)))); bg.addColorStop(.55, rgb(body)); bg.addColorStop(1, rgb(body.map(v => v * .55)));
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(x - w * .5, yb - h * .12); ctx.lineTo(x - w * .5, yb - h * .5); ctx.quadraticCurveTo(x - w * .5, yb - h * .58, x - w * .4, yb - h * .6);
  ctx.lineTo(x - w * .3, yb - h * .97); ctx.quadraticCurveTo(x, yb - h * 1.02, x + w * .3, yb - h * .97); ctx.lineTo(x + w * .4, yb - h * .6); ctx.quadraticCurveTo(x + w * .5, yb - h * .58, x + w * .5, yb - h * .5); ctx.lineTo(x + w * .5, yb - h * .12); ctx.closePath(); ctx.fill();
  const gw = ctx.createLinearGradient(0, yb - h * .95, 0, yb - h * .62);
  if (front) { gw.addColorStop(0, rgb(mixA('skyB').map(v => v * .9))); gw.addColorStop(1, rgb(mixA('skyT').map(v => v * .5))); } else { gw.addColorStop(0, `rgba(20,24,30,.95)`); gw.addColorStop(1, `rgba(60,70,84,${.9 - m * .5})`); }
  ctx.fillStyle = gw; ctx.beginPath(); ctx.moveTo(x - w * .36, yb - h * .62); ctx.lineTo(x - w * .27, yb - h * .92); ctx.lineTo(x + w * .27, yb - h * .92); ctx.lineTo(x + w * .36, yb - h * .62); ctx.closePath(); ctx.fill();
  ctx.fillStyle = `rgba(0,0,0,.45)`; ctx.fillRect(x - w * .5, yb - h * .2, w, h * .08);
  return h;
}
function drawLead(o, x, yb, w) {
  const h = carShape(x, yb, w, false), m = S.m, b = S.brake;
  ctx.fillStyle = 'rgba(235,235,225,.85)'; ctx.fillRect(x - w * .09, yb - h * .36, w * .18, h * .1);
  for (const sd of [-1, 1]) {
    const lx = x + sd * w * .38, ly = yb - h * .44;
    ctx.fillStyle = `rgb(${lerp(170, 255, Math.max(m, b))},${20 + b * 20},${26 + b * 10})`; ctx.fillRect(lx - w * .085, ly - h * .05, w * .17, h * .1);
    const glow = Math.max(m * .75, b * .9);

      const rg = ctx.createLinearGradient(0, yb, 0, yb + w * .5); rg.addColorStop(0, `rgba(255,40,40,${glow * .45})`); rg.addColorStop(1, 'rgba(255,40,40,0)'); ctx.fillStyle = rg; ctx.fillRect(lx - w * .06, yb, w * .12, w * .5); ctx.restore(); }

function drawObjects(dt) {

/* ---------- cabin ---------- */
function drawAnchor(x, y, s, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);

  ctx.fillStyle = g; for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * s * .72, s * .86); ctx.lineTo(sd * s * .5, s * 1.04); ctx.lineTo(sd * s * .72, s * 1.12); ctx.closePath(); ctx.fill(); }

}
function drawCabin(t) {
  const m = S.m, inner = mixA('inner');

    const x0 = sd < 0 ? 0 : W; ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 - sd * pw, 0); ctx.lineTo(x0 - sd * pw * .18, H * .84); ctx.lineTo(x0, H * .84); ctx.closePath();
    g = ctx.createLinearGradient(x0, 0, x0 - sd * pw, 0); g.addColorStop(0, rgb(inner.map(v => v * .6))); g.addColorStop(.85, rgb(inner)); g.addColorStop(1, rgb(inner.map(v => v + 22))); ctx.fillStyle = g; ctx.fill();
  }

  ctx.fillStyle = rgb(inner.map(v => v * .8)); ctx.fillRect(W / 2 - mw * .025, H * .04, mw * .05, my - H * .04 + 2);
  ctx.fillStyle = rgb(inner); ctx.beginPath(); ctx.roundRect(mx, my, mw, mh, mh * .35); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.roundRect(mx + mh * .12, my + mh * .12, mw - mh * .24, mh * .76, mh * .26); ctx.clip();
  g = ctx.createLinearGradient(0, my, 0, my + mh); g.addColorStop(0, C('skyB')); g.addColorStop(.48, C('tline')); g.addColorStop(.5, C('rd1')); g.addColorStop(1, C('rd2')); ctx.fillStyle = g; ctx.fillRect(mx, my, mw, mh);
  ctx.fillStyle = C('yel'); ctx.fillRect(W / 2 + mw * .08, my + mh * .5, mw * .015, mh * .5);
  if (m > .1) { ctx.globalCompositeOperation = 'lighter'; const fx = W / 2 - mw * .18 + Math.sin(t * .3) * mw * .05; for (const k of [-1, 1]) { const rg = ctx.createRadialGradient(fx + k * mw * .05, my + mh * .58, 0, fx + k * mw * .05, my + mh * .58, mh * .3); rg.addColorStop(0, `rgba(255,245,220,${m})`); rg.addColorStop(1, 'rgba(255,240,210,0)'); ctx.fillStyle = rg; ctx.fillRect(mx, my, mw, mh); } ctx.globalCompositeOperation = 'source-over'; }
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(mx, my, mw, mh * .3);
  ctx.restore();
  /* hanging anchor charm (pendulum) */
  const len = mh * 1.5, ax = W / 2 + mw * .18, ay = my + mh, ex = ax + Math.sin(S.sw) * len, ey = ay + Math.cos(S.sw) * len;
  ctx.strokeStyle = 'rgba(30,30,34,.95)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ex, ey); ctx.stroke();
  drawAnchor(ex, ey - mh * .05, mh * .42, -S.sw * .9);

  ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, dy + H * .035); ctx.quadraticCurveTo(W / 2, dy - H * .03, W, dy + H * .035); ctx.lineTo(W, H); ctx.closePath();
  g = ctx.createLinearGradient(0, dy - H * .03, 0, H); g.addColorStop(0, rgb(inner.map(v => v + 14))); g.addColorStop(.12, rgb(inner)); g.addColorStop(1, rgb(inner.map(v => v * .5))); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${.14 - m * .08})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, dy + H * .035); ctx.quadraticCurveTo(W / 2, dy - H * .03, W, dy + H * .035); ctx.stroke();

    ctx.fillStyle = 'rgba(220,224,230,.55)'; ctx.font = `600 ${gr * .2}px Montserrat, Arial, sans-serif`; ctx.textAlign = 'center'; ctx.fillText(lbl, gx, gy + gr * .45);
  }

  ctx.strokeStyle = '#0b0b0d'; ctx.lineWidth = wr * .15; ctx.beginPath(); ctx.arc(0, 0, wr, 0, 7); ctx.stroke();
  ctx.strokeStyle = `rgba(255,255,255,${.12 - m * .06})`; ctx.lineWidth = wr * .03; ctx.beginPath(); ctx.arc(0, 0, wr * 1.035, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();

}

/* ---------- input ---------- */
let lastMove = -1e9; const hint = document.getElementById('hint'); let hinted = false;
function point(e) { S.steerT = clamp((e.clientX / W - .5) * 2, -1, 1); lastMove = performance.now(); if (!hinted) { hinted = true; setTimeout(() => hint.classList.add('gone'), 2500); } }
cv.addEventListener('pointermove', point); cv.addEventListener('pointerdown', point);
setTimeout(() => hint.classList.add('gone'), 7000);
const seg = document.getElementById('seg'), bD = document.getElementById('bDay'), bN = document.getElementById('bNight');
function setMode(night) { S.mT = night ? 1 : 0; seg.dataset.mode = night ? 'night' : 'day'; bD.setAttribute('aria-pressed', !night); bN.setAttribute('aria-pressed', night); }
bD.onclick = () => setMode(false); bN.onclick = () => setMode(true);
addEventListener('keydown', e => { if (e.key === 'n' || e.key === 'N') setMode(S.mT < .5); if (e.key === 'ArrowLeft') { S.steerT = clamp(S.steerT - .25, -1, 1); lastMove = performance.now(); } if (e.key === 'ArrowRight') { S.steerT = clamp(S.steerT + .25, -1, 1); lastMove = performance.now(); } });
const hr = new Date().getHours(); setMode(hr >= 19 || hr < 6); S.m = S.mT;

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000) * (reduce ? .35 : 1); last = now; S.t += dt;
  S.m = lerp(S.m, S.mT, 1 - Math.pow(.25, dt));
  if (Math.abs(S.m - S.mT) < .002) S.m = S.mT;
  S.nextCurve -= dt; if (S.nextCurve <= 0) { S.curveT = R() < .3 ? 0 : (R() * 2 - 1) * .9; S.nextCurve = 4 + R() * 6; }

  if (now - lastMove > 4000) S.steerT = Math.sin(S.t * .17) * .25 - S.curve * .15;
  S.steer = lerp(S.steer, S.steerT, dt * 2.2);

  S.swv += (-14 * S.sw - 1.1 * S.swv - dl * 1.6 + Math.sin(S.t * 7) * .15) * dt; S.sw += S.swv * dt; S.sw = clamp(S.sw, -.9, .9);

})();
