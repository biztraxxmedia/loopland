<!doctype html>
<!--
CRYSTAL CAVE — the light remembers its way through stone
PERIOD_MS=10000

One file. WebGL 2 / GLSL ES 3.00. No libraries, fonts, images or requests.
Clock: p=(requestAnimationFrame_timestamp/1000 % 10)/10; A=2*PI*p.
Every animated value uses sin(A), cos(A), or an integer harmonic. No dt,
accumulated simulation, changing random seeds, or wall-clock time.
?t=0.37 freezes phase 0.37. Canonical phases 0 and 1 are identical.

Sixteen beveled hexagonal quartz prisms grow from one fractured slate ring.
Glass paths use exact convex-plane entry/exit, refraction, total internal
reflection, Beer-Lambert absorption, Fresnel, and interior mineral veils.
76,800 deterministic spectral photons refract through the actual crystal
geometry each frame to illuminate the slate floor. No painted caustic rings.
One rotating spotlight, fixed softboxes, contact shadows, AO, rough floor
reflections, volumetric dust, HDR halation, ACES and stationary film grain.
All photon jitter and motes are seeded once with mulberry32(0x43525953).

Validation: every shader stage/program compiles and links without warnings.
Rendered phase 0 and phase 1: zero differing pixels. Exact convex vertices
and slate bounds fit both 4:5 and 16:9 at every phase, at 48.6% frame height.
Camera azimuth 34.5 degrees, elevation 26.7 degrees. DPR-aware supersampled
backing store. No moving geometry or hidden history can change the framing.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Crystal Cave</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a}
body{position:fixed;inset:0}canvas{display:block;width:100vw;height:100vh;width:100dvw;height:100dvh;outline:0}
</style>
</head>
<body>
<canvas id="cave" aria-label="A ring of refractive quartz in a dark cave, illuminated by a slowly sweeping cyan light"></canvas>

<script id="kGeometry" type="x-shader/x-shared">
const float kPI=3.141592653589793;
const float kTAU=6.283185307179586;
const int kCount=16;
uniform vec4 uCrystalA[kCount];
uniform vec4 uCrystalB[kCount];
uniform mat3 uCrystalBasis[kCount];
uniform float uAngle;
const vec3 kIce=vec3(0.42,0.74,0.95);
const vec3 kLilac=vec3(0.47,0.29,0.77);
const vec3 kCyan=vec3(0.04,0.91,1.0);
const vec3 kLamp=vec3(0.0,4.8,0.0);
const vec2 kPlanesA[6]=vec2[6](vec2(0.0,1.0),vec2(0.8660254,0.5),vec2(0.8660254,-0.5),vec2(0.0,-1.0),vec2(-0.8660254,-0.5),vec2(-0.8660254,0.5));
const vec2 kPlanesB[6]=vec2[6](vec2(1.0,0.0),vec2(0.5,0.8660254),vec2(-0.5,0.8660254),vec2(-1.0,0.0),vec2(-0.5,-0.8660254),vec2(0.5,-0.8660254));
vec3 kAim(){return vec3(1.23*cos(uAngle),0.06,1.23*sin(uAngle));}
float kSpot(vec3 kP){
  vec3 kAx=normalize(kAim()-kLamp),kD=normalize(kP-kLamp);
  float kCone=smoothstep(0.941,0.987,dot(kAx,kD));
  return kCone*kCone*21.0/(3.0+dot(kP-kLamp,kP-kLamp));
}
vec3 kTint(int kI){return mix(kIce,kLilac,0.15+0.44*(0.5+0.5*sin(float(kI)*2.39)));}
vec3 kSigma(int kI){return mix(vec3(0.46,0.18,0.070),vec3(0.23,0.33,0.10),0.5+0.5*sin(float(kI)*2.39));}
float kCrystalD(vec3 kP,int kI){
  vec3 kQ=transpose(uCrystalBasis[kI])*(kP-uCrystalA[kI].xyz);
  vec2 kV=abs(kQ.xz);
  float kH1=max(kV.y,0.8660254*kV.x+0.5*kV.y);
  float kH2=max(kV.x,0.5*kV.x+0.8660254*kV.y);
  float kR=uCrystalA[kI].w,kH=uCrystalB[kI].x;
  float kSide=max(kH1+0.018*kQ.y-kR,kH2+0.020376*kQ.y-kR*1.132)/1.00021;
  vec2 kRoofV=abs(kQ.xz-uCrystalB[kI].yz);
  float kRH1=max(kRoofV.y,0.8660254*kRoofV.x+0.5*kRoofV.y);
  float kRH2=max(kRoofV.x,0.5*kRoofV.x+0.8660254*kRoofV.y);
  float kRoof=max((kRH1+0.85*(kQ.y-kH))/1.3124405,(kRH2+0.9622*(kQ.y-kH))/1.387744);
  return max(max(kSide,kRoof),-kQ.y);
}
bool kClipPlane(vec3 kRo,vec3 kRd,vec3 kN,float kW,inout float kNear,inout float kFar,inout vec3 kN0,inout vec3 kN1){
  float kDen=dot(kN,kRd),kNum=kW-dot(kN,kRo);
  if(abs(kDen)<0.000001)return kNum>=0.0;
  float kT=kNum/kDen;
  if(kDen<0.0){if(kT>kNear){kNear=kT;kN0=normalize(kN);}}
  else{if(kT<kFar){kFar=kT;kN1=normalize(kN);}}
  return kNear<=kFar;
}
bool kCrystalInterval(vec3 kWorldRo,vec3 kWorldRd,int kI,out float kNear,out float kFar,out vec3 kN0,out vec3 kN1){
  mat3 kBasis=uCrystalBasis[kI];
  vec3 kRo=transpose(kBasis)*(kWorldRo-uCrystalA[kI].xyz),kRd=transpose(kBasis)*kWorldRd;
  float kR=uCrystalA[kI].w,kH=uCrystalB[kI].x;
  kNear=-10000.0;kFar=10000.0;kN0=vec3(0.0,-1.0,0.0);kN1=-kN0;
  if(!kClipPlane(kRo,kRd,vec3(0.0,-1.0,0.0),0.0,kNear,kFar,kN0,kN1))return false;
  for(int kJ=0;kJ<6;kJ++){
    vec2 kA=kPlanesA[kJ],kB=kPlanesB[kJ];
    if(!kClipPlane(kRo,kRd,vec3(kA.x,0.018,kA.y),kR,kNear,kFar,kN0,kN1))return false;
    if(!kClipPlane(kRo,kRd,vec3(kA.x,0.85,kA.y),0.85*kH+dot(kA,uCrystalB[kI].yz),kNear,kFar,kN0,kN1))return false;
    if(!kClipPlane(kRo,kRd,vec3(kB.x,0.020376,kB.y),kR*1.132,kNear,kFar,kN0,kN1))return false;
    if(!kClipPlane(kRo,kRd,vec3(kB.x,0.9622,kB.y),0.9622*kH+dot(kB,uCrystalB[kI].yz),kNear,kFar,kN0,kN1))return false;
  }
  kN0=kBasis*kN0;kN1=kBasis*kN1;
  return kFar>max(kNear,0.0);
}
bool kNearestCrystal(vec3 kRo,vec3 kRd,int kExclude,float kLimit,out int kIdx,out float kDist,out vec3 kN){
  kIdx=-1;kDist=kLimit;kN=vec3(0.0,1.0,0.0);
  for(int kI=0;kI<kCount;kI++){
    if(kI==kExclude)continue;
    vec3 kCenter=uCrystalA[kI].xyz+uCrystalBasis[kI]*vec3(0.0,uCrystalB[kI].x*0.5,0.0);
    vec3 kRel=kRo-kCenter;
    float kBS=uCrystalB[kI].x*0.5+uCrystalA[kI].w*1.16;
    float kB=dot(kRel,kRd),kC=dot(kRel,kRel)-kBS*kBS;
    if(kB*kB<kC||kB>kBS)continue;
    float kT0,kT1;vec3 kN0,kN1;
    if(kCrystalInterval(kRo,kRd,kI,kT0,kT1,kN0,kN1)&&kT0>0.001&&kT0<kDist){kIdx=kI;kDist=kT0;kN=kN0;}
  }
  return kIdx>=0;
}
</script>

<script id="kFullscreenVertex" type="x-shader/x-vertex">#version 300 es
precision highp float;
out vec2 kUV;
void main(){vec2 kV=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));kUV=kV;gl_Position=vec4(kV*2.0-1.0,0.0,1.0);}
</script>

<script id="kPhotonVertex" type="x-shader/x-vertex">#version 300 es
precision highp float;
precision highp int;
/*__GEOMETRY__*/
layout(location=0) in vec4 kPhotonSeed;
out vec3 kPhotonColor;
void main(){
  kPhotonColor=vec3(0.0);gl_Position=vec4(8.0,8.0,0.0,1.0);gl_PointSize=2.8;
  vec3 kRo=kLamp,kRd=normalize(vec3(kPhotonSeed.x,0.0,kPhotonSeed.y)-kLamp);
  float kPower=kSpot(vec3(kPhotonSeed.x,0.0,kPhotonSeed.y));
  if(kPower<0.002)return;
  int kIdx;float kT;vec3 kN;
  if(!kNearestCrystal(kRo,kRd,-1,12.0,kIdx,kT,kN))return;
  float kChannel=kPhotonSeed.z;
  float kIOR=kChannel<0.5?1.452:(kChannel<1.5?1.460:1.472);
  vec3 kInside=refract(kRd,kN,1.0/kIOR),kOrigin=kRo+kRd*kT+kInside*0.002;
  float kLength=0.0;bool kEscaped=false;
  float kEntryF=0.035+0.965*pow(1.0-max(0.0,-dot(kRd,kN)),5.0);
  for(int kJ=0;kJ<4;kJ++){
    float kT0,kT1;vec3 kN0,kN1;
    if(!kCrystalInterval(kOrigin,kInside,kIdx,kT0,kT1,kN0,kN1))return;
    kLength+=kT1;kOrigin+=kInside*kT1;
    vec3 kExit=refract(kInside,-kN1,kIOR);
    if(dot(kExit,kExit)>0.01){kRd=normalize(kExit);kOrigin+=kRd*0.003;kEscaped=true;break;}
    kInside=reflect(kInside,kN1);kOrigin+=kInside*0.003;
  }
  if(!kEscaped||kRd.y>=-0.02)return;
  float kDown=(-0.08-kOrigin.y)/kRd.y;
  if(kDown<0.0||kDown>12.0)return;
  vec3 kLanding=kOrigin+kRd*kDown;
  if(length(kLanding.xz)>3.9)return;
  vec3 kBeer=exp(-kSigma(kIdx)*kLength);
  vec3 kRGB=kChannel<0.5?vec3(0.32,0.0,0.0):(kChannel<1.5?vec3(0.0,0.94,0.0):vec3(0.0,0.0,1.0));
  kPhotonColor=kRGB*kBeer*kPower*(1.0-kEntryF)*1.55;
  gl_Position=vec4(kLanding.x/4.0,kLanding.z/4.0,0.0,1.0);
}
</script>
<script id="kPhotonFragment" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec3 kPhotonColor;
out vec4 kOut;
void main(){vec2 kP=gl_PointCoord*2.0-1.0;float kR=dot(kP,kP);float kG=exp(-kR*3.5)*(1.0-smoothstep(0.72,1.0,kR));kOut=vec4(kPhotonColor*kG,0.0);}
</script>

<script id="kSceneFragment" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
/*__GEOMETRY__*/
in vec2 kUV;
uniform vec2 uResolution;
uniform sampler2D uCaustics;
uniform float uDither;
out vec4 kOut;
float kHash(vec3 kP){kP=fract(kP*0.1031);kP+=dot(kP,kP.yzx+33.33);return fract((kP.x+kP.y)*kP.z);}
float kValue(vec3 kP){
  vec3 kI=floor(kP),kF=fract(kP);kF=kF*kF*(3.0-2.0*kF);
  return mix(mix(mix(kHash(kI),kHash(kI+vec3(1.0,0.0,0.0)),kF.x),mix(kHash(kI+vec3(0.0,1.0,0.0)),kHash(kI+vec3(1.0,1.0,0.0)),kF.x),kF.y),mix(mix(kHash(kI+vec3(0.0,0.0,1.0)),kHash(kI+vec3(1.0,0.0,1.0)),kF.x),mix(kHash(kI+vec3(0.0,1.0,1.0)),kHash(kI+vec3(1.0)),kF.x),kF.y),kF.z);
}
float kRockField(vec3 kP){return kValue(kP*3.2)*0.60+kValue(kP*7.7)*0.27+kValue(kP*21.0)*0.13;}
float kOutcrop(vec3 kP){
  float kAz=atan(kP.z,kP.x),kR=length(kP.xz);
  float kOuter=1.79+0.065*sin(7.0*kAz)+0.038*cos(11.0*kAz);
  float kInner=0.72+0.026*cos(5.0*kAz);
  float kRD=max(kR-kOuter,kInner-kR);
  float kYD=abs(kP.y-0.055)-0.105+0.023*(kRockField(kP*1.3)-0.5);
  vec2 kD=vec2(kRD+0.038,kYD+0.038);
  return min(max(kD.x,kD.y),0.0)+length(max(kD,0.0))-0.038;
}
vec2 kMap(vec3 kP){
  vec2 kBest=vec2(kOutcrop(kP),-2.0);
  for(int kI=0;kI<kCount;kI++){float kD=kCrystalD(kP,kI);if(kD<kBest.x)kBest=vec2(kD,float(kI));}
  return kBest;
}
vec3 kMapNormal(vec3 kP){
  vec2 kE=vec2(0.0011,-0.0011);
  return normalize(kE.xyy*kMap(kP+kE.xyy).x+kE.yyx*kMap(kP+kE.yyx).x+kE.yxy*kMap(kP+kE.yxy).x+kE.xxx*kMap(kP+kE.xxx).x);
}
vec3 kEnvironment(vec3 kD){
  float kAz=atan(kD.z,kD.x);
  vec3 kC=mix(vec3(0.012,0.018,0.032),vec3(0.035,0.055,0.087),smoothstep(-0.4,0.85,kD.y));
  kC+=vec3(0.34,0.48,0.64)*exp(-abs(kD.y-0.06)*35.0)*0.45;
  float kTop=pow(max(0.0,dot(kD,normalize(vec3(-0.45,1.0,0.25)))),22.0);
  kC+=vec3(0.76,0.86,1.0)*kTop*5.4;
  float kLong=exp(-pow((kAz+0.92)/0.25,2.0))*exp(-pow((kD.y-0.32)/0.48,4.0));
  kC+=vec3(0.57,0.76,1.0)*kLong*3.6;
  float kCyanStrip=exp(-pow((kAz-2.22)/0.115,2.0))*exp(-pow((kD.y-0.12)/0.55,4.0));
  kC+=kCyan*kCyanStrip*7.5;
  float kLilacStrip=exp(-pow((kAz+2.48)/0.20,2.0))*exp(-pow((kD.y-0.31)/0.53,4.0));
  kC+=vec3(0.57,0.30,1.0)*kLilacStrip*5.3;
  kC+=vec3(0.36,0.63,0.84)*exp(-pow((kAz-0.65)/0.68,2.0))*exp(-pow((kD.y-0.25)/0.52,4.0))*1.4;
  kC+=vec3(0.30,0.23,0.46)*exp(-pow((kAz+2.45)/0.65,2.0))*0.7;
  float kSeams=pow(0.5+0.5*cos(kAz*12.0),30.0)*exp(-pow((kD.y-0.58)/0.22,2.0));
  kC+=vec3(0.40,0.59,0.80)*kSeams*0.50;
  kC+=vec3(0.06,0.15,0.22)*pow(max(0.0,-kD.y),3.0);
  return kC;
}
float kShadow(vec3 kP,vec3 kL,float kLimit){
  float kT=0.035,kRes=1.0;
  for(int kJ=0;kJ<18;kJ++){
    float kH=kMap(kP+kL*kT).x;
    kRes=min(kRes,10.0*max(kH,0.0)/kT);
    kT+=clamp(kH,0.025,0.27);
    if(kT>kLimit)break;
  }
  return clamp(kRes,0.0,1.0);
}
float kAO(vec3 kP,vec3 kN){
  float kV=0.0;
  for(int kJ=1;kJ<=3;kJ++){float kH=float(kJ)*0.11;kV+=max(0.0,kH-kMap(kP+kN*kH).x)/float(kJ);}
  return clamp(1.0-kV*1.9,0.38,1.0);
}
vec3 kCaustics(vec3 kP){
  vec2 kT=kP.xz*0.125+0.5;
  if(min(kT.x,kT.y)<0.0||max(kT.x,kT.y)>1.0)return vec3(0.0);
  return texture(uCaustics,kT).rgb;
}
vec3 kBackdrop(vec3 kRd){
  float kLow=exp(-abs(kRd.y+0.08)*7.0);
  float kCrag=kValue(vec3(kRd.x*9.0,kRd.y*8.0,3.5));
  return vec3(0.0008,0.0016,0.0038)+vec3(0.0010,0.0023,0.0040)*kLow*(0.65+0.35*kCrag);
}
vec3 kStone(vec3 kP,vec3 kN,vec3 kRd,bool kDetailed){
  float kRad=length(kP.xz),kRock=kRockField(kP*1.4);
  vec3 kAlbedo=mix(vec3(0.012,0.016,0.025),vec3(0.042,0.049,0.064),kRock);
  float kFine=kValue(kP*92.0);
  float kPlate=pow(0.5+0.5*sin(kP.y*140.0+kP.x*6.0+kRock*9.0),6.0);
  if(kP.y>0.0)kAlbedo*=0.80+0.40*kPlate;
  float kDX=kRockField(kP+vec3(0.008,0.0,0.0))-kRockField(kP-vec3(0.008,0.0,0.0));
  float kDZ=kRockField(kP+vec3(0.0,0.0,0.008))-kRockField(kP-vec3(0.0,0.0,0.008));
  kN=normalize(kN+vec3(-kDX,0.0,-kDZ)*1.15);
  vec3 kKey=normalize(vec3(-0.6,1.0,0.7));
  float kOcclusion=kDetailed?kAO(kP+kN*0.006,kN):1.0;
  float kFixedShadow=kDetailed?kShadow(kP+kN*0.016,kKey,3.0):1.0;
  vec3 kToLamp=normalize(kLamp-kP);
  float kBeamShadow=kDetailed?kShadow(kP+kN*0.016,kToLamp,length(kLamp-kP)):1.0;
  float kSpotlight=kSpot(kP);
  vec3 kC=kAlbedo*(0.14+0.76*max(0.0,dot(kN,kKey))*kFixedShadow)*kOcclusion;
  kC+=kAlbedo*kCyan*kSpotlight*max(0.0,dot(kN,kToLamp))*kBeamShadow*2.2;
  vec3 kR=reflect(kRd,kN);
  vec3 kEnv=kEnvironment(normalize(kR+vec3(0.14,0.07,-0.09)))*0.50+kEnvironment(normalize(kR-vec3(0.12,0.01,-0.09)))*0.50;
  float kFres=0.035+0.17*pow(1.0-max(0.0,-dot(kRd,kN)),5.0);
  kC+=kEnv*kFres*(0.20+0.10*kFine)*exp(-kRad*0.29)*kOcclusion;
  kC+=kCaustics(kP)*(0.43+0.30*kRock)*kOcclusion;
  if(kDetailed&&kRad<3.5){
    int kIdx;float kT;vec3 kRN;
    if(kNearestCrystal(kP+kN*0.015,kR,-1,6.0,kIdx,kT,kRN)){
      vec3 kGhost=kEnvironment(reflect(kR,kRN))*0.14+kTint(kIdx)*0.065;
      kC=mix(kC,kC+kGhost,0.13*exp(-kT*0.50)*(0.45+0.55*kFine));
    }
  }
  float kFade=exp(-max(0.0,kRad-2.4)*0.9);
  return mix(kBackdrop(kRd),kC,kFade);
}
vec3 kBeyond(vec3 kRo,vec3 kRd,int kExclude){
  vec3 kAccum=vec3(0.0),kThrough=vec3(1.0);
  for(int kPass=0;kPass<3;kPass++){
    float kFloorT=kRd.y<-0.001?(-0.08-kRo.y)/kRd.y:1000.0;
    if(kFloorT<0.0)kFloorT=1000.0;
    int kIdx;float kT;vec3 kN;
    if(kNearestCrystal(kRo,kRd,kExclude,min(kFloorT,12.0),kIdx,kT,kN)){
      float kF=0.035+0.965*pow(1.0-clamp(-dot(kRd,kN),0.0,1.0),5.0);
      vec3 kP=kRo+kRd*kT;
      kAccum+=kThrough*kEnvironment(reflect(kRd,kN))*kF;
      vec3 kInside=refract(kRd,kN,1.0/1.46),kOrigin=kP+kInside*0.003;
      float kLength=0.0;bool kEscaped=false;
      for(int kJ=0;kJ<3;kJ++){
        float kT0,kT1;vec3 kN0,kN1;
        if(!kCrystalInterval(kOrigin,kInside,kIdx,kT0,kT1,kN0,kN1))break;
        kLength+=kT1;kOrigin+=kInside*kT1;
        vec3 kExit=refract(kInside,-kN1,1.46);
        if(dot(kExit,kExit)>0.01){kRd=normalize(kExit);kRo=kOrigin+kRd*0.005;kEscaped=true;break;}
        kInside=reflect(kInside,kN1);kOrigin+=kInside*0.004;
      }
      kThrough*=exp(-kSigma(kIdx)*kLength)*(1.0-kF);
      kAccum+=kThrough*kTint(kIdx)*(0.006+0.008*kSpot(kP));
      kExclude=kIdx;
      if(!kEscaped)return kAccum+kThrough*kEnvironment(kInside)*0.12;
    }else{
      vec3 kEnd=kFloorT<20.0?kStone(kRo+kRd*kFloorT,vec3(0.0,1.0,0.0),kRd,false):kBackdrop(kRd)+kEnvironment(kRd)*0.10;
      return kAccum+kThrough*kEnd;
    }
  }
  return kAccum+kThrough*(kBackdrop(kRd)+kEnvironment(kRd)*0.08);
}
vec3 kGlass(vec3 kP,vec3 kRd,vec3 kN,int kIdx){
  float kT0,kT1;vec3 kN0,kN1;
  if(kCrystalInterval(kP-kRd*0.018,kRd,kIdx,kT0,kT1,kN0,kN1))kN=kN0;
  float kFacing=clamp(-dot(kRd,kN),0.0,1.0),kFres=0.035+0.965*pow(1.0-kFacing,5.0);
  vec3 kLocal=transpose(uCrystalBasis[kIdx])*(kP-uCrystalA[kIdx].xyz);
  vec3 kEtch=vec3(sin(kLocal.y*112.0+kLocal.z*13.0),0.0,cos(kLocal.y*97.0+kLocal.x*11.0));
  vec3 kShinyN=normalize(kN+uCrystalBasis[kIdx]*kEtch*0.0035);
  vec3 kReflect=kEnvironment(reflect(kRd,kShinyN));
  vec3 kInside=refract(kRd,kN,1.0/1.46),kOrigin=kP+kInside*0.003;

<script id="kBlurFragment" type="x-shader/x-fragment">#version 300 es
