<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

let W, H, dpr, L, u, cx, gY, bX, bY, bR, pedTop, bowlC, gravelC, chTop, chBot, M = 60, layers = {}, lampC, fc, fx, img, gw, gh, runes = [], cracks = [];
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------- stone helpers ---------- */

  const gr = g.createLinearGradient(0, y - rr, 0, y + rr); gr.addColorStop(0, shade('#e3b083', lit)); gr.addColorStop(.45, shade('#a87650', lit)); gr.addColorStop(1, shade('#3b2116', lit));

  g.strokeStyle = 'rgba(60,25,12,.4)'; g.lineWidth = 1; g.beginPath(); g.ellipse(x, y, rr * .18, rr * .45, 0, 0, 7); g.stroke();

let DSHIFT = 0, CRUMB = 0, LYING = 0, WEATHER = 'clear', MOONP = .5;
function dune(g, R, y0, amp, fill, ridge) {
  const ph = [R() * 6 + DSHIFT, R() * 6 - DSHIFT * 1.3, R() * 6 + DSHIFT * .7];
  g.beginPath(); g.moveTo(-M, H + M);
  const pts = []; for (let x = -M; x <= W + M; x += 6) { const y = y0 + Math.sin(x / W * 3.1 + ph[0]) * amp + Math.sin(x / W * 7.3 + ph[1]) * amp * .35 + Math.sin(x / W * 17 + ph[2]) * amp * .08; pts.push([x, y]); g.lineTo(x, y); }

}

/* ---------- layers ---------- */
function layer(fn) { const [c, g] = mk(W + 2 * M, H + 2 * M); g.translate(M, M); fn(g); return c; }
function buildSky() {
  layers.stars = layer(g => { const R = rng(11);
    for (let i = 0; i < 950; i++) { const y = R() * H * .6, a = (1 - y / (H * .62)) * .95 * R(); const tint = R(); g.fillStyle = tint < .12 ? `rgba(190,210,255,${a})` : tint < .2 ? `rgba(255,220,190,${a})` : `rgba(255,245,235,${a})`; const sz = R() < .05 ? 1.8 : R() < .4 ? 1.1 : .7; g.fillRect(R() * (W + 2 * M) - M, y - M * .5, sz, sz); } });
  layers.clouds = layer(g => { const R = rng(19 + DAYK * 31), NC = WEATHER === 'cloudy' ? 22 : WEATHER === 'storm' ? 4 : 6;
    for (let i = 0; i < NC; i++) { const y = H * (.28 + R() * .3), x = R() * W, w = W * (.2 + R() * .4); g.fillStyle = `rgba(255,${210 + R() * 40 | 0},${200 + R() * 40 | 0},${.08 + R() * .1})`; g.beginPath(); g.ellipse(x, y, w, H * .006 + R() * H * .009, 0, 0, 7); g.fill(); } });
  const mr = Math.min(W, H) * .07; const [mc, g] = mk(mr * 2 + 4, mr * 2 + 4); layers.moon = mc; layers.moonR = mr; const R = rng(29), c = mr + 2;
  const mg = g.createRadialGradient(c - mr * .3, c - mr * .3, mr * .1, c, c, mr); mg.addColorStop(0, '#fbf8ef'); mg.addColorStop(1, '#cfcabd'); g.fillStyle = mg; g.beginPath(); g.arc(c, c, mr, 0, 7); g.fill();
  g.save(); g.beginPath(); g.arc(c, c, mr, 0, 7); g.clip(); for (let i = 0; i < 14; i++) { const x = c + (R() * 2 - 1) * mr * .8, y = c + (R() * 2 - 1) * mr * .8, r = mr * (.05 + R() * .16); g.fillStyle = 'rgba(150,145,135,.35)'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,250,.25)'; g.beginPath(); g.arc(x - r * .2, y - r * .2, r * .7, 0, 7); g.fill(); }
  const ill = .5 - .5 * Math.cos(MOONP * Math.PI * 2), off = ill * mr * 2.15 * (MOONP < .5 ? 1 : -1); g.fillStyle = 'rgba(14,18,40,.88)'; if (ill < .98) { g.beginPath(); g.arc(c - off, c, mr * 1.03, 0, 7); g.fill(); } g.restore();
}
function nightOf(c) { const n = document.createElement('canvas'); n.width = c.width; n.height = c.height; const g = n.getContext('2d'); g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(14,22,60,.66)'; g.fillRect(0, 0, n.width, n.height); return n; }
/* sky palettes (5 stops) */
const PAL = {night: ['#04060f', '#080d24', '#0e1736', '#172449', '#22305a'], dusk: ['#120a24', '#2f1538', '#7a2a3a', '#c9502e', '#f08a3c'], day: ['#2c62b0', '#3f7cc4', '#6fa6da', '#a9cde6', '#f3dcb4']};
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PALr = {}; for (const k in PAL) PALr[k] = PAL[k].map(hex);
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
let SUN = {e: 0, n: 0, d: 0, day: 0, frac: 0}, DAYK = 0;
const TWINK = (() => { const R = rng(55); return Array.from({length: 34}, () => ({x: R(), y: R() * .5, z: 2 + R() * 3, r: .8 + R() * 2.2, p: R() * 6})); })();
function drawSky(t, ox, oy) {
  const CYCLE = reduce ? 400 : 150, wT = t + TOFF, th = (wT / CYCLE) * Math.PI * 2 + .06;
  const e = Math.sin(th), n = clamp(-e / .28, 0, 1), d = clamp((e - .05) / .35, 0, 1);

    for (const st of TWINK) { const a = n * (.35 + .65 * Math.max(0, Math.sin(t * st.r + st.p))), x = st.x * W - ox * 8, y = st.y * H - oy * 5, z = st.z; ctx.fillStyle = `rgba(255,250,240,${a})`; ctx.fillRect(x - z, y - .5, z * 2 + 1, 1); ctx.fillRect(x - .5, y - z, 1, z * 2 + 1); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(x, y, 1.2, 0, 7); ctx.fill(); } }

    g2 = ctx.createRadialGradient(x, y, 0, x, y, sr); g2.addColorStop(0, '#fffbe8'); g2.addColorStop(.7, low > .5 ? '#ffc070' : '#fff1c4'); g2.addColorStop(1, 'rgba(255,170,80,0)'); ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(x, y, sr, 0, 7); ctx.fill(); });
