<!doctype html>
<html lang="en">

<title>The Astronomer's Nocturne</title>
<link rel="icon" href="data:,">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050605}
canvas{display:block;width:100vw;height:100vh;width:100dvw;height:100dvh;outline:0}
</style>

<body>
<canvas id="orrery" aria-label="An illuminated brass clockwork orrery in a dark walnut observatory"></canvas>
<script>
/*
 THE ASTRONOMER'S NOCTURNE
 A single-file, entirely procedural WebGL2 moving sculpture.
 No images, fonts, dependencies, network calls, or accumulated animation state.

 LOOP CONTRACT
   L = 10 seconds. The only animation input is A = TAU * p, with
   p = (requestAnimationFrame_timestamp / 1000 % L) / L.
   Orbital turns: +1, -2, +3, -1; driven pinions: +3 / -6.
   All other motion uses sin/cos of integer harmonics of A.
   ?t=0.37 freezes at 37%. ?t=1 canonicalizes to exactly ?t=0.
   Grain is spatial and stationary. Resize changes resolution, never time.

 RENDER
   SDF primary rays; soft key shadows; five-point ambient occlusion;
   GGX direct lighting; designed, roughness-filtered reflection environment;
   procedural wood, engraving and enamel; reflected ground; depth-tested
   seeded dust; four-scale HDR bloom; ACES; gamma; subtle lens aberration.
*/
(() => {
  'use strict';
  const kCanvas = document.getElementById('orrery');
  const kGl = kCanvas.getContext('webgl2', {
    alpha:false, antialias:false, depth:true, stencil:false,
    premultipliedAlpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance'
  });
  if (!kGl) { console.error('The Astronomer\'s Nocturne requires WebGL2.'); return; }
  const kHdr = !!kGl.getExtension('EXT_color_buffer_float');
  kGl.getExtension('OES_texture_float_linear');
  const kParams = new URLSearchParams(location.search);
  const kRawFreeze = kParams.has('t') ? Number(kParams.get('t')) : NaN;
  const kFreeze = Number.isFinite(kRawFreeze) ? ((kRawFreeze % 1) + 1) % 1 : null;
  const kTau = Math.PI * 2;
  const kLoopSeconds = 10;

  const kVertex = `#version 300 es
  precision highp float;
  out vec2 vUv;
  void main(){
    vec2 kPos=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
    vUv=kPos;
    gl_Position=vec4(kPos*2.0-1.0,0.0,1.0);
  }`;

  const kScene = `#version 300 es
  precision highp float;
  precision highp int;
  in vec2 vUv;
  out vec4 kFrag;
  uniform vec2 uSize;
  uniform float uAngle;
  uniform float uHdr;
  uniform vec3 uEye;
  uniform vec3 uRight;
  uniform vec3 uUp;
  uniform vec3 uForward;
  const float kPi=3.14159265358979323846;
  const float kTau=6.28318530717958647692;
  const float kGround=-1.515;
  const vec3 kSun=vec3(0.0,1.19,0.0);
  const vec3 kKey=vec3(-3.8,6.5,4.4);

  mat2 kRot(float kA){float kC=cos(kA),kS=sin(kA);return mat2(kC,-kS,kS,kC);}
  float kHash(vec3 kP){kP=fract(kP*.1031);kP+=dot(kP,kP.yzx+33.33);return fract((kP.x+kP.y)*kP.z);}
  float kValue(vec3 kP){
    vec3 kI=floor(kP),kF=fract(kP);kF=kF*kF*(3.0-2.0*kF);
    return mix(mix(mix(kHash(kI),kHash(kI+vec3(1,0,0)),kF.x),mix(kHash(kI+vec3(0,1,0)),kHash(kI+vec3(1,1,0)),kF.x),kF.y),
      mix(mix(kHash(kI+vec3(0,0,1)),kHash(kI+vec3(1,0,1)),kF.x),mix(kHash(kI+vec3(0,1,1)),kHash(kI+vec3(1,1,1)),kF.x),kF.y),kF.z);
  }
  float kFbm(vec3 kP){return .57*kValue(kP)+.28*kValue(kP*2.07+7.3)+.15*kValue(kP*4.11+14.1);}
  float kRoundBox2(vec2 kP,vec2 kB,float kR){vec2 kQ=abs(kP)-kB+kR;return length(max(kQ,0.0))+min(max(kQ.x,kQ.y),0.0)-kR;}
  float kRoundBox3(vec3 kP,vec3 kB,float kR){vec3 kQ=abs(kP)-kB+kR;return length(max(kQ,0.0))+min(max(kQ.x,max(kQ.y,kQ.z)),0.0)-kR;}
  float kCylinder(vec3 kP,float kR,float kH){vec2 kQ=vec2(length(kP.xz)-kR,abs(kP.y)-kH);return min(max(kQ.x,kQ.y),0.0)+length(max(kQ,0.0));}
  float kTurned(vec3 kP,float kR,float kH,float kBevel){return kRoundBox2(vec2(length(kP.xz),kP.y),vec2(kR,kH),kBevel);}
  float kTorus(vec3 kP,float kR,float kTube){return length(vec2(length(kP.xz)-kR,kP.y))-kTube;}
  float kLink(vec3 kP,vec3 kB,vec3 kC,float kR){vec3 kV=kC-kB;float kH=clamp(dot(kP-kB,kV)/dot(kV,kV),0.0,1.0);return length(kP-kB-kV*kH)-kR;}
  vec2 kNear(vec2 kB,vec2 kC){return kC.x<kB.x?kC:kB;}
  vec3 kMeridian(vec3 kP){kP-=vec3(0,1.135,0);kP.xy=kRot(.17)*kP.xy;kP.yz=kRot(-.40)*kP.yz;kP.xz=kRot(.11)*kP.xz;return kP;}
  vec3 kHorizon(vec3 kP){kP-=vec3(0,.15,0);kP.yz=kRot(.065)*kP.yz;return kP;}
  float kOrbitR(int kI){return kI==0?.76:(kI==1?1.26:(kI==2?1.85:2.43));}
  float kOrbitY(int kI){return .68-float(kI)*.205;}
  float kOrbitA(int kI){
    return kI==0?uAngle+.9:(kI==1?-2.0*uAngle+3.0:(kI==2?3.0*uAngle+4.9:-uAngle+1.65));
  }
  float kPlanetR(int kI){return kI==0?.119:(kI==1?.188:(kI==2?.242:.177));}
  vec3 kOrbital(vec3 kP,int kI){kP.xz=kRot(kOrbitA(kI))*kP.xz;return kP;}
  float kGear(vec3 kP,float kR,float kH,float kA,float kTeeth){
    float kStep=kTau/kTeeth;
    float kT=floor((atan(kP.z,kP.x)+kA)/kStep+.5)*kStep-kA;
    vec3 kQ=kP;kQ.xz=kRot(kT)*kQ.xz;
    return min(kCylinder(kP,kR-.015,kH),kRoundBox3(kQ-vec3(kR,0,0),vec3(.031,kH,.018),.003));
  }

  // Material ids: 1 brass, 2 walnut, 3 engraved meridian, 4 dial,
  // 5 ivory sun, 6/7/8/9 planets, 10 graduated horizon, 11 gear.
  vec2 kMap(vec3 kP){
    vec3 kM=kMeridian(kP);
    vec2 kD=vec2(kRoundBox2(vec2(length(kM.xy)-2.86,kM.z),vec2(.061,.037),.009),3.0);
    float kLip=length(vec2(length(kM.xy)-2.919,kM.z))-.012;
    kLip=min(kLip,length(vec2(length(kM.xy)-2.801,kM.z))-.011);
    kD=kNear(kD,vec2(kLip,1));
    vec3 kH=kHorizon(kP);
    kD=kNear(kD,vec2(kRoundBox2(vec2(length(kH.xz)-2.74,kH.y),vec2(.066,.024),.009),10));
    kD=kNear(kD,vec2(kTorus(kH-vec3(0,.025,0),2.80,.009),1));

    // Turned main shaft and individually machined bearing collars.
    kD=kNear(kD,vec2(kCylinder(kP-vec3(0,.18,0),.063,.96),1));
    for(int kI=0;kI<4;kI++){
      float kY=kOrbitY(kI),kR=kOrbitR(kI);
      vec3 kQ=kOrbital(kP,kI);
      kD=kNear(kD,vec2(kTurned(kP-vec3(0,kY,0),.139+float(kI)*.013,.064,.012),1));
      // Slender full orbit guides are supported by the rotating radial trusses.
      kD=kNear(kD,vec2(kTorus(kP-vec3(0,kY-.027,0),kR,.0105),1));
      kD=kNear(kD,vec2(kLink(kQ,vec3(.08,kY,0),vec3(kR,kY,0),.026),1));
      kD=kNear(kD,vec2(kLink(kQ,vec3(.16,kY-.071,0),vec3(kR*.68,kY-.071,0),.013),1));
      kD=kNear(kD,vec2(kLink(kQ,vec3(kR*.68,kY-.071,0),vec3(kR,kY,0),.013),1));
      kD=kNear(kD,vec2(kCylinder(kQ-vec3(kR,kY+.103,0),.024,.111),1));
      vec3 kB=kQ-vec3(kR,kY+.23,0);
      float kGlobe=length(kB)-kPlanetR(kI);
      kD=kNear(kD,vec2(kGlobe,6.0+float(kI)));
      {
        vec3 kSpin=kB;kSpin.xy=kRot(.27+float(kI)*.13)*kSpin.xy;
        kD=kNear(kD,vec2(kTorus(kSpin,kPlanetR(kI)*.997,.008),1));
        if(kI==2){
          kD=kNear(kD,vec2(kRoundBox2(vec2(length(kSpin.xz)-.342,kSpin.y),vec2(.049,.005),.003),1));
        }
        kD=kNear(kD,vec2(kCylinder(kB-vec3(0,kPlanetR(kI)+.015,0),.015,.024),1));
      }
      // Engraved counterpoise, mechanically joined to the same bearing.
      kD=kNear(kD,vec2(kLink(kQ,vec3(-.07,kY,0),vec3(-.26,kY,0),.021),1));
      kD=kNear(kD,vec2(kTurned(kQ-vec3(-.29,kY,0),.075,.037,.009),1));
    }

    vec3 kS=kP-kSun;
    kD=kNear(kD,vec2(length(kS)-.318,5));
    if(length(kS)<.47){
      kS.xz=kRot(uAngle)*kS.xz;
      kD=kNear(kD,vec2(kTorus(kS,.319,.013),1));
      vec3 kV=kS;kV.yz=kRot(kPi*.5)*kV.yz;
      kD=kNear(kD,vec2(kTorus(kV,.32,.009),1));
      kV=kS;kV.xy=kRot(kPi*.5)*kV.xy;
      kD=kNear(kD,vec2(kTorus(kV,.32,.009),1));
      kD=kNear(kD,vec2(kCylinder(kS-vec3(0,.34,0),.034,.05),1));
      kD=kNear(kD,vec2(length(kS-vec3(0,.408,0))-.039,1));
    }

    float kBaseBound=kCylinder(kP-vec3(0,-1.09,0),1.28,.45);
    if(kBaseBound<kD.x+.08){
      kD=kNear(kD,vec2(kTurned(kP-vec3(0,-1.18,0),1.145,.218,.057),2));
      kD=kNear(kD,vec2(kTurned(kP-vec3(0,-1.438,0),1.235,.07,.031),2));
      kD=kNear(kD,vec2(kTurned(kP-vec3(0,-.941,0),1.22,.052,.023),2));
      kD=kNear(kD,vec2(kTorus(kP-vec3(0,-.891,0),1.176,.021),1));
      kD=kNear(kD,vec2(kTorus(kP-vec3(0,-1.396,0),1.162,.021),1));
      kD=kNear(kD,vec2(kTurned(kP-vec3(0,-.875,0),1.09,.018,.009),4));
      kD=kNear(kD,vec2(kTorus(kP-vec3(0,-.854,0),1.066,.01),1));
      kD=kNear(kD,vec2(kCylinder(kP-vec3(0,-.737,0),.16,.138),1));
      kD=kNear(kD,vec2(kGear(kP-vec3(0,-.795,0),.445,.035,uAngle*3.0,36.0),11));
      kD=kNear(kD,vec2(kGear(kP-vec3(-.661,-.794,0),.195,.034,-uAngle*6.0,18.0),11));
      kD=kNear(kD,vec2(kGear(kP-vec3(.415,-.793,.514),.195,.034,-uAngle*6.0+.15,18.0),11));
      kD=kNear(kD,vec2(kCylinder(kP-vec3(-.661,-.75,0),.031,.07),1));
      kD=kNear(kD,vec2(kCylinder(kP-vec3(.415,-.75,.514),.031,.07),1));
      // Eight sunk fasteners around the dial, repeated in polar coordinates.
      float kAz=atan(kP.z,kP.x),kSector=kTau/8.0;
      vec3 kQ=kP;kQ.xz=kRot(floor(kAz/kSector+.5)*kSector)*kQ.xz;
      kD=kNear(kD,vec2(kCylinder(kQ-vec3(.973,-.846,0),.027,.009),1));
    }
    return kD;
  }

  vec3 kNormal(vec3 kP,float kE){
    vec2 kV=vec2(1,-1)*.57735027;
    return normalize(kV.xyy*kMap(kP+kV.xyy*kE).x+kV.yyx*kMap(kP+kV.yyx*kE).x+
                     kV.yxy*kMap(kP+kV.yxy*kE).x+kV.xxx*kMap(kP+kV.xxx*kE).x);
  }
  float kShadow(vec3 kP,vec3 kL,float kEnd){
    float kVis=1.0,kT=.025;
    for(int kJ=0;kJ<34;kJ++){
      float kH=kMap(kP+kL*kT).x;
      if(kH<.0012)return .07;
      kVis=min(kVis,9.0*kH/kT);
      kT+=clamp(kH,.018,.28);
      if(kT>kEnd)break;
    }
    return clamp(kVis,.07,1.0);
  }
  float kOcclusion(vec3 kP,vec3 kN){
    float kOcc=0.0,kWeight=1.0;
    for(int kJ=0;kJ<5;kJ++){
      float kD=.018+.065*float(kJ);
      kOcc+=(kD-kMap(kP+kN*kD).x)*kWeight;kWeight*=.64;
    }
    return clamp(1.0-kOcc*2.65,.18,1.0);
  }

  float kPanel(vec3 kD,vec3 kAxis,float kWidth,float kPower){
    return exp(-pow(max(0.0,1.0-dot(kD,normalize(kAxis)))/kWidth,kPower));
  }
  // Reflection-only studio: every source is a soft falloff, no hard rectangles.
  vec3 kEnvironment(vec3 kD){
    vec3 kC=mix(vec3(.011,.008,.005),vec3(.065,.075,.071),smoothstep(-.2,1.0,kD.y));
    kC+=vec3(3.7,2.67,1.56)*kPanel(kD,vec3(-.6,.85,.45),.12,3.0);
    kC+=vec3(2.8,2.95,2.72)*kPanel(kD,vec3(.3,.97,-.18),.065,2.5);
    kC+=vec3(1.65,1.28,.79)*kPanel(kD,vec3(.85,.4,.65),.035,2.0);
    kC+=vec3(.12,1.05,.97)*kPanel(kD,vec3(.5,.25,-.85),.045,2.0);
    float kAz=atan(kD.z,kD.x);
    kC+=vec3(1.35,.85,.35)*exp(-pow((kD.y-.055)/.022,2.0))*(.4+.6*pow(.5+.5*cos(kAz+1.8),4.0));
    kC+=vec3(1.3,1.05,.68)*exp(-pow((kAz+2.6)/.065,2.0))*smoothstep(-.2,.2,kD.y)*(1.0-smoothstep(.65,.9,kD.y));
    kC*=1.0-.18*exp(-pow(sin(kAz*5.0)/.06,2.0))*smoothstep(.1,.4,kD.y);
    return kC;
  }
  vec3 kRoughEnvironment(vec3 kR,vec3 kN,float kRough){
    vec3 kT=normalize(cross(kR,abs(kR.y)<.9?vec3(0,1,0):vec3(1,0,0)));
    vec3 kB=cross(kR,kT);
    float kSpread=kRough*kRough*.6;
    return .4*kEnvironment(kR)+.15*(kEnvironment(normalize(kR+kT*kSpread))+kEnvironment(normalize(kR-kT*kSpread))+
      kEnvironment(normalize(kR+kB*kSpread))+kEnvironment(normalize(kR-kB*kSpread)));
  }

  float kTick(float kA,float kCount,float kWidth){
    float kD=abs(fract(kA/kTau*kCount+.5)-.5);
    return 1.0-smoothstep(kWidth,kWidth+max(fwidth(kD),.012),kD);
  }
  struct kSurface{vec3 kAlbedo;float kMetal;float kRough;vec3 kEmit;float kCoat;};
  kSurface kMaterial(vec3 kP,vec3 kN,float kId){
    float kPatina=kFbm(kP*5.2),kFine=kValue(kP*185.0);
    kSurface kS=kSurface(vec3(.54,.309,.104)*(.78+.25*kPatina),.94,.205,vec3(0),0.0);
    if(kId==2.0){
      float kSwirl=kFbm(vec3(kP.x*2.5,kP.y*9.0,kP.z*2.5));
      float kFiber=.5+.5*sin(kP.y*137.0+12.0*kSwirl+sin(atan(kP.z,kP.x)*4.0)*2.0);
      float kPore=pow(.5+.5*sin(kP.y*660.0+kSwirl*30.0),17.0);
      kS.kAlbedo=mix(vec3(.032,.009,.0035),vec3(.142,.052,.016),.25+.6*kFiber)*(.85-.25*kPore);
      kS.kMetal=.02;kS.kRough=.29;kS.kCoat=.7;
    }else if(kId==3.0){
      vec3 kQ=kMeridian(kP);float kR=length(kQ.xy),kAz=atan(kQ.y,kQ.x)-uAngle;
      float kMinor=kTick(kAz,180.0,.065)*smoothstep(2.867,2.874,kR);
      float kMajor=kTick(kAz,36.0,.042)*smoothstep(2.827,2.834,kR);
      float kInner=exp(-pow((kR-2.814)/.003,2.0));
      float kEtch=max(kMinor,max(kMajor,kInner));
      kS.kAlbedo*=mix(1.0,.16,kEtch);kS.kRough+=kEtch*.15;
    }else if(kId==10.0){
      vec3 kQ=kHorizon(kP);float kR=length(kQ.xz),kAz=atan(kQ.z,kQ.x);
      float kMarks=max(kTick(kAz,120.0,.06)*smoothstep(2.73,2.745,kR),kTick(kAz,24.0,.037));
      kS.kAlbedo*=mix(1.0,.18,kMarks);kS.kRough=.22+.12*kMarks;
    }else if(kId==4.0){
      float kAz=atan(kP.z,kP.x),kR=length(kP.xz);
      float kMarks=max(kTick(kAz,100.0,.075)*smoothstep(.91,.925,kR),kTick(kAz,20.0,.042)*smoothstep(.82,.83,kR));
      float kCircles=exp(-pow((kR-.805)/.004,2.0))+exp(-pow((kR-1.025)/.003,2.0));
      kS.kAlbedo=mix(vec3(.58,.435,.249),vec3(.026,.019,.011),max(kMarks,min(kCircles,1.0)));
      kS.kMetal=.13;kS.kRough=.32;
    }else if(kId==5.0){
      vec3 kQ=kP-kSun;kQ.xz=kRot(uAngle)*kQ.xz;
      float kLat=asin(clamp(kQ.y/.318,-1.0,1.0));float kAz=atan(kQ.z,kQ.x);
      float kLines=max(kTick(kAz,24.0,.025)*.55,(1.0-smoothstep(.025,.052,abs(sin(kLat*6.0))))*.5);
      kS.kAlbedo=mix(vec3(.82,.605,.285),vec3(.39,.205,.05),kLines);
      kS.kMetal=.43;kS.kRough=.22;kS.kEmit=vec3(.34,.139,.032)*(.85-.3*kLines);kS.kCoat=.4;
    }else if(kId>=6.0&&kId<=9.0){
      int kI=int(kId)-6;vec3 kQ=kOrbital(kP,kI)-vec3(kOrbitR(kI),kOrbitY(kI)+.23,0);
      kQ.xz=kRot(float(kI+1)*uAngle)*kQ.xz;
      float kAz=atan(kQ.z,kQ.x);float kLat=asin(clamp(kQ.y/kPlanetR(kI),-1.0,1.0));
      float kGrid=max(kTick(kAz,12.0,.018)*.6,1.0-smoothstep(.022,.054,abs(sin(kLat*5.0))));
      if(kI==0){kS.kAlbedo=vec3(.62,.34,.11);kS.kMetal=.9;kS.kRough=.17;}
      if(kI==1){kS.kAlbedo=mix(vec3(.006,.076,.082),vec3(.027,.235,.21),smoothstep(.36,.65,kFbm(kQ*18.0)));kS.kMetal=.18;kS.kRough=.155;kS.kCoat=1.0;}
      if(kI==2){
        float kBelt=.5+.5*sin(kLat*39.0+3.0*kFbm(kQ*20.0));
        kS.kAlbedo=mix(vec3(.39,.225,.09),vec3(.78,.656,.427),.35+.6*kBelt);kS.kMetal=.13;kS.kRough=.245;kS.kCoat=.55;
      }
      if(kI==3){kS.kAlbedo=mix(vec3(.003,.043,.051),vec3(.009,.139,.155),kPatina);kS.kMetal=.33;kS.kRough=.15;kS.kCoat=.95;}
      kS.kAlbedo=mix(kS.kAlbedo,vec3(.52,.305,.098),kGrid*.68);
    }else if(kId==11.0){
      vec3 kQ=kP;float kR=length(kP.xz),kA=uAngle*3.0;
      if(length(kP.xz-vec2(-.661,0))<.25){kQ-=vec3(-.661,0,0);kR=length(kQ.xz);kA=-uAngle*6.0;}
      else if(length(kP.xz-vec2(.415,.514))<.25){kQ-=vec3(.415,0,.514);kR=length(kQ.xz);kA=-uAngle*6.0+.15;}
      float kSpokes=pow(.5+.5*cos((atan(kQ.z,kQ.x)+kA)*6.0),12.0);
      float kChannels=smoothstep(.065,.09,kR)*(1.0-smoothstep(.14,.17,kR))*(1.0-kSpokes);
      kS.kAlbedo*=1.0-.78*kChannels;kS.kRough=.25;
    }
    // Extremely shallow machining texture: reflected highlights remain crisp.
    kS.kRough=clamp(kS.kRough+(kFine-.5)*.018,.11,.48);
    return kS;
  }

  vec3 kFresnel(float kC,vec3 kF0){return kF0+(1.0-kF0)*pow(1.0-clamp(kC,0.0,1.0),5.0);}
  vec3 kBrdf(kSurface kS,vec3 kN,vec3 kV,vec3 kL,vec3 kPower){
    vec3 kH=normalize(kV+kL);float kNl=max(dot(kN,kL),0.0),kNv=max(dot(kN,kV),.001);
    float kNh=max(dot(kN,kH),0.0),kVh=max(dot(kV,kH),0.0);
    float kA=max(kS.kRough*kS.kRough,.025),kA2=kA*kA;
    float kD=kA2/(kPi*pow(kNh*kNh*(kA2-1.0)+1.0,2.0));

  addEventListener('resize',kSchedule,{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(kRaf);kRaf=0;}else kSchedule();});
  kCanvas.addEventListener('webglcontextlost',kEvent=>{kEvent.preventDefault();cancelAnimationFrame(kRaf);console.error('WebGL context lost.');});
  kCanvas.addEventListener('webglcontextrestored',()=>location.reload());
  kSchedule();
})();
</script>
</body>
