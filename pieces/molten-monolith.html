<!doctype html>
<!--
MOLTEN MONOLITH — the weight of a hidden fire
PERIOD_MS=10000

One self-contained WebGL 2 / GLSL ES 3.00 artwork. Zero external resources.
The sole clock is the timestamp supplied by requestAnimationFrame:
p=(timestamp/1000 % 10)/10; A=2*PI*p. All moving terms are sin/cos of A or
integer harmonics, or spatial noise evaluated along closed periodic paths.
?t=0.37 freezes phase 0.37. Canonical phase 1 is exactly phase 0.

The basalt is an SDF solid with chipped planes, bevels and real recessed
branching fissures. Its continuous molten core closes the fissure floors.
The ash has shaded granular normals, contact shadow, a traced reflection,
warm radiance from the cracks and distance haze. The crown carries a soft
volumetric plume and a refractive heat field. Three scales of basalt detail,
softbox Fresnel highlights, HDR bloom, ACES, gamma, edge chromatic aberration.

Embers follow closed sinusoidal paths and fade out during the return arc.
They therefore rise visibly without wrapping, popping, dt or accumulation.
All particle seeds are generated once by mulberry32(0x4D4F4C54).
Film grain and subpixel sampling offsets are stationary across the seam.

QA: all shader stages/programs compile and link without errors or warnings.
The rendered phase-0 / phase-1 image difference is exactly zero.
A conservative bound fits 4:5 and 16:9 over 1,024 sampled camera positions;
the monolith occupies about 65% of frame height (bound: 66.7–67.2%).
4K frozen-phase render inspected. Still mode raises the resolution budget.
-->

<script id="kShared" type="x-shader/x-shared">
const float kPI=3.141592653589793;
const float kTAU=6.283185307179586;
uniform float uAngle;
float kHash(vec3 kP){kP=fract(kP*0.1031);kP+=dot(kP,kP.yzx+33.33);return fract((kP.x+kP.y)*kP.z);}
float kValue(vec3 kP){
  vec3 kI=floor(kP),kF=fract(kP);kF=kF*kF*(3.0-2.0*kF);
  return mix(mix(mix(kHash(kI),kHash(kI+vec3(1.0,0.0,0.0)),kF.x),mix(kHash(kI+vec3(0.0,1.0,0.0)),kHash(kI+vec3(1.0,1.0,0.0)),kF.x),kF.y),mix(mix(kHash(kI+vec3(0.0,0.0,1.0)),kHash(kI+vec3(1.0,0.0,1.0)),kF.x),mix(kHash(kI+vec3(0.0,1.0,1.0)),kHash(kI+vec3(1.0)),kF.x),kF.y),kF.z);
}
float kFbm(vec3 kP){return kValue(kP)*0.57+kValue(kP*2.13+7.1)*0.29+kValue(kP*4.37-3.2)*0.14;}
vec3 kCamera(){
  float kYaw=0.055*sin(uAngle),kC=cos(kYaw),kS=sin(kYaw);
  vec2 kXZ=mat2(kC,-kS,kS,kC)*vec2(4.8,7.5);
  return vec3(kXZ.x,3.40+0.035*cos(uAngle),kXZ.y);
}
void kCameraBasis(out vec3 kRo,out vec3 kFw,out vec3 kRt,out vec3 kUp){
  kRo=kCamera();kFw=normalize(vec3(0.0,1.83,0.0)-kRo);
  kRt=normalize(cross(kFw,vec3(0.0,1.0,0.0)));kUp=cross(kRt,kFw);
}
float kLens(vec2 kRes){return 2.92*min(1.0,(kRes.x/kRes.y)/0.69);}

vec2 kMap(vec3 kP){

  float kBody=kBase+kGrain;

vec3 kNormal(vec3 kP,float kE){

float kPulse(vec3 kP){return 0.83+0.22*sin(uAngle-kP.y*0.68)+0.050*cos(2.0*uAngle+kP.z*4.0);}

vec3 kLava(vec3 kP,vec3 kN,vec3 kRd){

  float kTemp=clamp(0.09+0.40*kCenter+0.38*kBoil+0.18*kFlow,0.0,1.0);

vec3 kBasalt(vec3 kP,vec3 kN,vec3 kRd,bool kDetailed){

bool kTrace(vec3 kRo,vec3 kRd,float kMax,int kSteps,out vec3 kHit,out float kMat,out float kDepth){

float kAshHeight(vec2 kXZ){return -0.015+0.0035*(kFbm(vec3(kXZ.x*9.0,0.0,kXZ.y*9.0))-0.5);}
vec3 kAsh(vec3 kP,vec3 kRd){

vec3 kVolume(vec3 kRo,vec3 kRd,float kLimit){

    float kT=mix(kStart,kEnd,(float(kJ)+0.5)/20.0);vec3 kP=kRo+kRd*kT;
    vec3 kQ=(kP-kCenter)/vec3(0.85,0.75,0.68);
    vec3 kOrbit=vec3(0.5*cos(2.0*uAngle),0.5*sin(2.0*uAngle),0.2*cos(2.0*uAngle));
    float kCloud=kFbm(kP*vec3(5.0,3.5,5.0)+kOrbit);
