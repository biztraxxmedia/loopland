<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Chrome Koi</title>
<style>
  :root { color-scheme: dark; background: #09090b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #09090b; }
  canvas { display: block; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; }
</style>
<link rel="icon" href="data:,"></head>
<body>
<canvas id="scene" aria-label="Chrome koi circling in a dark reflective pool"></canvas>
<script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}
</script>
<script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
in vec2 vUv;
out vec4 fragColor;
uniform vec2 uResolution;
uniform float uPhase;

const float PI = 3.141592653589793;
const float TAU = 6.283185307179586;

vec3 rotY(vec3 p, float a){
  float c = cos(a), s = sin(a);
  return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z);
}

float sdSphere(vec3 p, float r){ return length(p)-r; }
float sdEllipsoid(vec3 p, vec3 r){
  float k0 = length(p/r);
  float k1 = length(p/(r*r));
  return k0*(k0-1.0)/max(k1, 0.0001);
}
float sdCapsule(vec3 p, vec3 a, vec3 b, float r){
  vec3 pa=p-a, ba=b-a;
  float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
  return length(pa-ba*h)-r;
}
vec2 opUnion(vec2 a, vec2 b){ return a.x < b.x ? a : b; }
vec2 opSmoothUnion(vec2 a, vec2 b, float k){
  float h=clamp(0.5+0.5*(b.x-a.x)/k,0.0,1.0);
  return vec2(mix(b.x,a.x,h)-k*h*(1.0-h), h<0.5 ? b.y : a.y);
}

vec3 fishCenter(float id, float A){
  float orbit=A+id*PI;
  return vec3(1.04*cos(orbit), 0.014*sin(2.0*A+id*PI), -1.04*sin(orbit));
}
float fishHeading(float id, float A){ return A+id*PI+0.5*PI; }
vec3 fishLocal(vec3 p, float id, float A){
  vec3 q=rotY(p-fishCenter(id,A),-fishHeading(id,A));
  float tailWeight=1.0-smoothstep(-1.28,0.28,q.x);
  q.z += 0.058*sin(3.0*A+q.x*3.0+id*PI)*tailWeight;
  q.z += 0.014*sin(2.0*A+q.x*1.4+id*PI);
  q.y += 0.018*sin(2.0*A+q.x*1.8+id*PI);
  return q;
}

vec2 mapFishLocal(vec3 q, float id){
  float baseMat=1.0+4.0*id;
  vec2 d=vec2(sdEllipsoid(q-vec3(-0.12,0.0,0.0),vec3(0.78,0.225,0.29)),baseMat);
  d=opSmoothUnion(d,vec2(sdEllipsoid(q-vec3(0.48,0.012,0.0),vec3(0.43,0.195,0.255)),baseMat),0.16);
  d=opSmoothUnion(d,vec2(sdEllipsoid(q-vec3(0.82,-0.015,0.0),vec3(0.255,0.132,0.185)),baseMat),0.11);
  d=opSmoothUnion(d,vec2(sdCapsule(q,vec3(-0.70,0.0,0.0),vec3(-1.12,0.0,0.0),0.095),baseMat),0.09);
  d=opSmoothUnion(d,vec2(sdEllipsoid(q-vec3(-1.31,0.0,0.135),vec3(0.29,0.052,0.17)),baseMat),0.085);
  d=opSmoothUnion(d,vec2(sdEllipsoid(q-vec3(-1.31,0.0,-0.135),vec3(0.29,0.052,0.17)),baseMat),0.085);
  d=opSmoothUnion(d,vec2(sdEllipsoid(q-vec3(-0.055,0.215,0.0),vec3(0.255,0.105,0.135)),baseMat),0.075);
  vec3 finA=rotY(q-vec3(0.16,-0.065,0.205),-0.52);
  vec3 finB=rotY(q-vec3(0.16,-0.065,-0.205),0.52);
  d=opSmoothUnion(d,vec2(sdEllipsoid(finA,vec3(0.29,0.041,0.125)),baseMat),0.065);
  d=opSmoothUnion(d,vec2(sdEllipsoid(finB,vec3(0.29,0.041,0.125)),baseMat),0.065);
  float rimMat=4.0+4.0*id;
  float eyeMat=3.0+4.0*id;
  d=opUnion(d,vec2(sdSphere(q-vec3(0.675,0.12,0.242),0.066),rimMat));
  d=opUnion(d,vec2(sdSphere(q-vec3(0.675,0.12,-0.242),0.066),rimMat));
  d=opUnion(d,vec2(sdSphere(q-vec3(0.679,0.135,0.291),0.034),eyeMat));
  d=opUnion(d,vec2(sdSphere(q-vec3(0.679,0.135,-0.291),0.034),eyeMat));
  return d;
}
vec2 mapFishOnly(vec3 p, float A){
  vec3 c0=fishCenter(0.0,A), c1=fishCenter(1.0,A);
  float bound0=length(p-c0)-1.72;
  float bound1=length(p-c1)-1.72;
  vec2 a=bound0<0.24?mapFishLocal(fishLocal(p,0.0,A),0.0):vec2(bound0,1.0);
  vec2 b=bound1<0.24?mapFishLocal(fishLocal(p,1.0,A),1.0):vec2(bound1,5.0);
  return opUnion(a,b);
}
vec2 mapScene(vec3 p, float A){
  vec2 fish=mapFishOnly(p,A);
  vec2 water=vec2(p.y+0.425,9.0);
  return opUnion(fish,water);
}

vec3 env(vec3 d){
  d=normalize(d);
  float ang=atan(d.z,d.x);
  vec3 c=d.y>0.0
    ? mix(vec3(0.014,0.014,0.018),vec3(0.095,0.091,0.086),pow(max(d.y,0.0),0.78))
    : mix(vec3(0.042,0.040,0.041),vec3(0.0035,0.0035,0.004),pow(clamp(-d.y,0.0,1.0),0.42));
  float horizon=exp(-abs(d.y-0.045)*46.0);
  c+=vec3(0.72,0.68,0.60)*horizon*0.72;
  float panelCoord=fract((ang+PI)*0.69);
  float panel=1.0-smoothstep(0.145,0.225,abs(panelCoord-0.5));
  float panelGate=smoothstep(-0.24,0.18,d.y)*(1.0-smoothstep(0.72,0.90,d.y));
  c+=vec3(0.74,0.71,0.65)*panel*panelGate*0.72;
  float seams=smoothstep(0.475,0.498,abs(panelCoord-0.5));
  c*=1.0-0.18*seams*panelGate;
  c+=vec3(1.0,0.96,0.87)*smoothstep(0.72,0.97,d.y)*1.55;
  float warmStrip=exp(-pow(abs(ang+0.56)/0.14,2.0))*smoothstep(-0.16,0.24,d.y)*(1.0-smoothstep(0.68,0.86,d.y));
  c+=vec3(1.0,0.88,0.72)*warmStrip*1.55;
  float redStrip=exp(-pow(abs(ang-1.14)/0.075,2.0))*smoothstep(-0.36,0.18,d.y)*(1.0-smoothstep(0.50,0.76,d.y));
  c+=vec3(1.0,0.075,0.022)*redStrip*2.8;
  float creamStrip=exp(-pow(abs(ang+2.18)/0.095,2.0))*smoothstep(-0.28,0.20,d.y)*(1.0-smoothstep(0.58,0.82,d.y));
  c+=vec3(0.94,0.88,0.76)*creamStrip*1.7;
  c+=vec3(0.22,0.18,0.15)*exp(-abs(d.y+0.02)*21.0)*0.42;
  return c;
}

float waterHeight(vec2 xz,float A){
  vec3 c0=fishCenter(0.0,A), c1=fishCenter(1.0,A);
  float r0=length(xz-c0.xz), r1=length(xz-c1.xz), rc=length(xz);
  float w0=sin(r0*24.0-3.0*A)*exp(-r0*1.28)*0.0075;
  float w1=sin(r1*24.0-3.0*A+0.85)*exp(-r1*1.28)*0.0075;
  float wc=sin(rc*15.0-3.0*A+0.4)*exp(-rc*1.45)*0.0028;
  return w0+w1+wc;
}
vec3 waterNormal(vec2 xz,float A){
  float e=0.008;
  float dx=(waterHeight(xz+vec2(e,0.0),A)-waterHeight(xz-vec2(e,0.0),A))/(2.0*e);
  float dz=(waterHeight(xz+vec2(0.0,e),A)-waterHeight(xz-vec2(0.0,e),A))/(2.0*e);
  return normalize(vec3(-dx,1.0,-dz));
}
float rippleBands(float r,float A,float phase){
  float w=0.5+0.5*cos(r*24.0-3.0*A+phase);
  return pow(max(w,0.0),16.0)*exp(-r*1.12);
}

vec3 calcNormal(vec3 p,float A){
  vec2 e=vec2(0.0018,0.0);
  return normalize(vec3(
    mapScene(p+e.xyy,A).x-mapScene(p-e.xyy,A).x,
    mapScene(p+e.yxy,A).x-mapScene(p-e.yxy,A).x,
    mapScene(p+e.yyx,A).x-mapScene(p-e.yyx,A).x
  ));
}
float softShadow(vec3 ro,vec3 rd,float mint,float maxt,float A){
  float res=1.0, t=mint;
  for(int i=0;i<34;i++){
    float h=mapScene(ro+rd*t,A).x;
    res=min(res,8.5*h/max(t,0.02));
    t+=clamp(h,0.022,0.24);
    if(res<0.025||t>maxt) break;
  }
  return clamp(res,0.0,1.0);
}
float calcAO(vec3 p,vec3 n,float A){
  float occ=0.0, sca=1.0;
  for(int i=0;i<5;i++){
    float h=0.025+0.043*float(i);
    float d=mapScene(p+n*h,A).x;
    occ+=(h-d)*sca;
    sca*=0.72;
  }
  return clamp(1.0-2.2*occ,0.0,1.0);
}
float hash12(vec2 p){
  vec3 p3=fract(vec3(p.xyx)*0.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
float koiSpots(vec3 q){
  float a=exp(-pow((q.x+0.23)/0.19,2.0)-pow((q.z-0.005)/0.17,2.0));
  float b=exp(-pow((q.x-0.22)/0.16,2.0)-pow((q.z+0.005)/0.15,2.0));
  float c=exp(-pow((q.x-0.62)/0.16,2.0)-pow((q.z-0.005)/0.13,2.0));
  float spots=max(a,max(b,c))*smoothstep(0.075,0.17,q.y);
  return smoothstep(0.31,0.72,spots);
}
vec3 shadeFish(vec3 p,vec3 rd,float A,float matId){
  float fishId=matId>=5.0?1.0:0.0;
  float localMat=matId-4.0*fishId;
  vec3 n=calcNormal(p,A);
  vec3 v=normalize(-rd);
  vec3 r=reflect(rd,n);
  vec3 reflected=env(r);
  vec3 normalEnv=env(n);
  float ndv=max(dot(n,v),0.0);
  float fres=0.07+0.93*pow(1.0-ndv,5.0);
  vec3 L=normalize(vec3(-0.42,0.88,0.34));
  vec3 hotL=normalize(vec3(0.72,0.28,-0.62));
  float shadow=softShadow(p+n*0.012,L,0.025,4.2,A);
  float ndl=max(dot(n,L),0.0)*shadow;
  float spec=pow(max(dot(reflect(-L,n),v),0.0),104.0)*shadow;
  float hotSpec=pow(max(dot(reflect(-hotL,n),v),0.0),82.0);
  float broadSpec=pow(max(dot(reflect(-L,n),v),0.0),19.0)*shadow;
  float ao=calcAO(p,n,A);
  vec3 c=mix(vec3(0.075,0.079,0.087),reflected*1.13,0.90+0.10*fres);
  c+=normalEnv*0.035;
  c*=mix(0.62,1.0,ao);
  c+=vec3(1.0,0.91,0.79)*(ndl*0.105+spec*1.65+broadSpec*0.12);
  c+=vec3(1.0,0.075,0.022)*hotSpec*0.88;
  c+=vec3(0.66,0.58,0.48)*pow(1.0-ndv,3.0)*max(dot(n,normalize(vec3(-0.8,0.18,-0.5))),0.0)*0.18;
  vec3 q=fishLocal(p,fishId,A);
  if(localMat<2.0){
    float patchV=koiSpots(q);
    float tailPatch=(1.0-smoothstep(-1.29,-1.04,q.x))*smoothstep(0.015,0.045,abs(q.y));
    patchV=max(patchV,tailPatch*0.68);
    vec3 ink=fishId<0.5?vec3(0.91,0.062,0.022):vec3(0.84,0.78,0.67);
    vec3 lacquer=ink*(0.34+0.32*ndl+0.23*clamp(reflected,0.0,1.0));
    c=mix(c,lacquer,patchV*0.93);
  }else if(localMat>2.5&&localMat<3.5){
    c=vec3(0.006,0.006,0.007)+reflected*0.16;
    c+=vec3(1.0,0.91,0.77)*pow(max(dot(reflect(-L,n),v),0.0),92.0)*1.8;
  }else if(localMat>3.5&&localMat<4.5){
    c=mix(vec3(0.74,0.68,0.57),reflected,0.52);
    c+=vec3(1.0,0.94,0.83)*spec*0.65;
  }
  return c;
}
vec3 shadeWater(vec3 p,vec3 rd,float A){
  vec3 n=waterNormal(p.xz,A);
  vec3 v=normalize(-rd);
  vec3 reflDir=reflect(rd,n);
  vec3 reflection=env(reflDir);
  float ndv=max(dot(n,v),0.0);
  float fres=0.18+0.82*pow(1.0-ndv,5.0);
  vec3 c=mix(vec3(0.010,0.0105,0.013),reflection,0.50*fres+0.18);
  vec3 c0=fishCenter(0.0,A),c1=fishCenter(1.0,A);
  float r0=length(p.xz-c0.xz),r1=length(p.xz-c1.xz),rc=length(p.xz);
  float rings=rippleBands(r0,A,0.0)+rippleBands(r1,A,0.85)+0.45*rippleBands(rc,A,0.4);
  c+=vec3(0.72,0.66,0.55)*rings*0.48;
  c+=vec3(0.10,0.075,0.055)*abs(waterHeight(p.xz,A))*8.0;
  if(reflDir.y>0.035){
    float rt=(0.0-p.y)/reflDir.y;
    if(rt>0.0&&rt<5.0){
      vec3 rp=p+reflDir*rt;
      vec2 fh=mapFishOnly(rp,A);
      float mask=1.0-smoothstep(-0.025,0.095,fh.x);
      float fid=fh.y>=5.0?1.0:0.0;
      vec3 tint=fid<0.5?vec3(0.38,0.027,0.012):vec3(0.35,0.32,0.27);
      vec3 reflectedKoi=mix(reflection,tint,0.38);
      c=mix(c,reflectedKoi,mask*0.31);
    }
  }
  return c;
}
float traceScene(vec3 ro,vec3 rd,float A,out vec2 hit){
  float t=0.0;
  hit=vec2(100.0,0.0);
  for(int i=0;i<112;i++){
    vec3 p=ro+rd*t;
    hit=mapScene(p,A);
    if(hit.x<0.0015+0.00004*t) return t;
    t+=max(hit.x*0.82,0.0015);
    if(t>24.0) break;
  }
  return -1.0;
}
vec3 aces(vec3 x){
  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);
}

void main(){
  float A=TAU*uPhase;
  vec2 uv=(gl_FragCoord.xy-0.5*uResolution.xy)/uResolution.y;
  vec3 ro=vec3(0.0,2.52,5.35);
  vec3 target=vec3(0.0,-0.025,0.0);
  vec3 ww=normalize(target-ro);
  vec3 uu=normalize(cross(ww,vec3(0.0,1.0,0.0)));
  vec3 vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+1.78*ww);
  vec2 hit;
  float t=traceScene(ro,rd,A,hit);
  vec3 col;
  if(t>0.0){
    vec3 p=ro+rd*t;
    if(hit.y>8.5) col=shadeWater(p,rd,A);
    else col=shadeFish(p,rd,A,hit.y);
  }else{
    col=env(rd);
  }
  float vignette=1.0-0.42*smoothstep(0.32,1.12,length(uv*vec2(0.78,1.18)));
  col*=vignette;
  float grain=hash12(gl_FragCoord.xy+vec2(cos(A),sin(A))*3.0)-0.5;
  col+=grain*0.012;
  col=aces(max(col,0.0)*1.08);
  col=pow(col,vec3(1.0/2.2));
  fragColor=vec4(col,1.0);
}
</script>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: true, depth: false, stencil: false, powerPreference: 'high-performance' });
  if (!gl) return;
  const vertexSource = document.getElementById('vertex-shader').textContent;
  const fragmentSource = document.getElementById('fragment-shader').textContent;
  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }
  const vs = compile(gl.VERTEX_SHADER, vertexSource);
  const fs = compile(gl.FRAGMENT_SHADER, fragmentSource);
  if (!vs || !fs) return;
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    return;
  }
  gl.useProgram(program);
  const uResolution = gl.getUniformLocation(program, 'uResolution');
  const uPhase = gl.getUniformLocation(program, 'uPhase');
  const L = 10.0;
  const query = new URLSearchParams(window.location.search).get('t');
  const requested = query === null ? NaN : Number(query);
  const frozenPhase = Number.isFinite(requested) ? ((requested % 1) + 1) % 1 : null;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.max(1, Math.round(window.innerWidth * dpr));
    const h = Math.max(1, Math.round(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    gl.uniform2f(uResolution, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();
  function render(timestamp) {
    const p = frozenPhase === null ? ((timestamp / 1000) % L) / L : frozenPhase;
    gl.uniform1f(uPhase, p);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (frozenPhase === null) requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
